name: Orivra SentenceFlow - starter lexicon A/B qualification
on:
  push:
    branches:
      - candidate/build294-sentenceflow-starter-lexicon-20261029
    paths:
      - .github/workflows/candidate-sentenceflow-starter-qualification.yml
      - app/src/testsupport/java/com/chroomareborn/keyboard/SentenceFlowAccuracyBenchmark.java
      - app/src/main/java/com/chroomareborn/keyboard/PredictionLite.java
      - app/src/main/java/com/chroomareborn/keyboard/SentenceRescue.java
      - app/src/testsupport/java/com/chroomareborn/keyboard/StarterLexiconConsistencyTest.java
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: orivra-sentenceflow-starter
  cancel-in-progress: true
jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - name: Checkout frozen original predictor and exact benchmark fixtures
        uses: actions/checkout@v4
        with:
          ref: ab02b22d458613e76d2e285ad00cb886bd6a25dc
          path: frozen-baseline
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Guard runtime-only and privacy scope
        shell: bash
        run: |
          set -euo pipefail
          test -s app/src/testsupport/java/com/chroomareborn/keyboard/SentenceFlowAccuracyBenchmark.java
          test -s app/src/testsupport/java/com/chroomareborn/keyboard/StarterLexiconConsistencyTest.java
          grep -Fq 'for(String[] completions:FIRST_LETTER.values())' app/src/main/java/com/chroomareborn/keyboard/PredictionLite.java
          grep -Fq 'No user typing or stored' app/src/testsupport/java/com/chroomareborn/keyboard/SentenceFlowAccuracyBenchmark.java
          if grep -Fq 'android.permission.INTERNET' app/src/main/AndroidManifest.xml; then exit 1; fi
          grep -Fq 'com.chroomareborn.keyboard.build293trial' app/build.gradle.kts
      - name: Compile actual SentenceFlow predictor and independent quality harness
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/orivra-prediction"
          javac -encoding UTF-8 -d "$RUNNER_TEMP/orivra-prediction" \
            app/src/main/java/com/chroomareborn/keyboard/PredictionLite.java \
            app/src/main/java/com/chroomareborn/keyboard/SentenceRescue.java \
            app/src/testsupport/java/com/chroomareborn/keyboard/SentenceFlowAccuracyBenchmark.java \
            app/src/testsupport/java/com/chroomareborn/keyboard/PredictionSmokeTest.java \
            app/src/testsupport/java/com/chroomareborn/keyboard/StarterLexiconConsistencyTest.java
      - name: Test starter consistency and original known-word smoke regressions
        shell: bash
        run: |
          set -euo pipefail
          timeout 120s java -Xmx1g -ea \
            -cp "$RUNNER_TEMP/orivra-prediction" \
            com.chroomareborn.keyboard.StarterLexiconConsistencyTest
          timeout 120s java -Xmx1g -ea \
            -cp "$RUNNER_TEMP/orivra-prediction" \
            com.chroomareborn.keyboard.PredictionSmokeTest
      - name: Measure frozen baseline on SAME GitHub runner
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/orivra-frozen-classes"
          javac -encoding UTF-8 -d "$RUNNER_TEMP/orivra-frozen-classes" \
            frozen-baseline/app/src/main/java/com/chroomareborn/keyboard/PredictionLite.java \
            frozen-baseline/app/src/main/java/com/chroomareborn/keyboard/SentenceRescue.java \
            frozen-baseline/app/src/testsupport/java/com/chroomareborn/keyboard/SentenceFlowAccuracyBenchmark.java
          timeout 900s java -Xmx1g -ea \
            -cp "$RUNNER_TEMP/orivra-frozen-classes" \
            com.chroomareborn.keyboard.SentenceFlowAccuracyBenchmark \
            | tee "$RUNNER_TEMP/sentenceflow-frozen-baseline.txt"
      - name: Run candidate measurements (same 147 fixtures as frozen baseline)
        shell: bash
        run: |
          set -euo pipefail
          timeout 900s java -Xmx1g -ea \
            -cp "$RUNNER_TEMP/orivra-prediction" \
            com.chroomareborn.keyboard.SentenceFlowAccuracyBenchmark \
            | tee "$RUNNER_TEMP/sentenceflow-starter.txt"
          printf '## SentenceFlow starter lexicon — same 147 synthetic fixtures\n\n' >> "$GITHUB_STEP_SUMMARY"
          grep -E '^GROUP|^WALL_MS=|^FIXTURE_COUNT=' \
            "$RUNNER_TEMP/sentenceflow-starter.txt" >> "$GITHUB_STEP_SUMMARY"
      - name: Compare candidate versus frozen baseline and reject accuracy regressions
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$RUNNER_TEMP/sentenceflow-frozen-baseline.txt" \
            "$RUNNER_TEMP/sentenceflow-starter.txt" <<'PY'
          import re,sys
          def parse(path):
              found={}
              for line in open(path,encoding="utf-8"):
                  m=re.match(r'^GROUP\s+(\w+)\s+n=\s*(\d+)\s+top1=\s*(\d+).*top3=\s*(\d+)',line)
                  if m:
                      found[m.group(1)]=tuple(map(int,m.groups()[1:]))
              return found
          baseline,current=map(parse,sys.argv[1:])
          expected=["known_word","word_one_typo","joined_exact",
              "joined_one_typo","joined_two_typos","reported_difficult","ALL"]
          assert set(expected)<=set(baseline)&set(current),"Metrics missing"
          for category in expected:
              b,c=baseline[category],current[category]
              assert b[0]==c[0],f"Benchmark size changed: {category}: {b[0]} vs {c[0]}"
              print(f"{category:20s} n={c[0]:3d} top1 {b[1]:3d}->{c[1]:3d} "
                    f"top3 {b[2]:3d}->{c[2]:3d}")
              if category in ("ALL","known_word","joined_exact",
                              "joined_one_typo","joined_two_typos"):
                  assert c[2]>=b[2],f"Top-3 regression: {category}"
          assert current["ALL"][1]>=baseline["ALL"][1],"Overall top-1 regressed"
          assert current["known_word"][1]>=baseline["known_word"][1],(
              "Correct dictionary words lost their safe first position")
          print("PASS: synthetic quality >= pinned predictor baseline")
          PY
          echo '### Pinned source baseline and Candidate compared on same runner' >> "$GITHUB_STEP_SUMMARY"
          echo 'No overall accuracy or joined-sentence top-3 regression.' >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve accurate benchmark report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Orivra-SentenceFlow-Starter-Quality-Candidate
          path: |
            ${{ runner.temp }}/sentenceflow-frozen-baseline.txt
            ${{ runner.temp }}/sentenceflow-starter.txt
          retention-days: 30
          if-no-files-found: warn
      - name: Qualification statement
        if: success()
        run: echo "Synthetic benchmark and starter lexicon consistency tested. No APK assembled, uploaded or handset-tested."
