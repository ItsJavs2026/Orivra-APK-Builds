name: Candidate 373 native emulator screenshots - option buttons and gesture area
on:
  push:
    branches:
      - research/build373-placement-screenshots-20261030
    paths:
      - ".github/workflows/visual-qa373-placements.yml"
      - ".github/scripts/capture373-placement.sh"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: orivra-candidate373-ui-screenshots
  cancel-in-progress: true
jobs:
  actual-android-screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Download exact signed Candidate 373 release APK and SHA-256
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/build/outputs/apk/debug
          base="https://github.com/ItsJavs2026/Orivra-APK-Builds/releases/download/candidate-373-20261030"
          curl -fLsS --retry 3 "$base/Orivra-Candidate-373.apk" -o app/build/outputs/apk/debug/app-debug.apk
          curl -fLsS --retry 3 "$base/Orivra-Candidate-373.apk.sha256" -o "$RUNNER_TEMP/release.sha256"
          hash="$(awk '{print $1}' "$RUNNER_TEMP/release.sha256")"
          printf '%s  %s\n' "$hash" "app/build/outputs/apk/debug/app-debug.apk" | sha256sum -c
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging app/build/outputs/apk/debug/app-debug.apk | head -1 |
            grep -Fq "package: name='com.chroomareborn.keyboard.build373trial' versionCode='373'"
          echo "PASS: exact qualified release APK reused, no rebuilt app or dummy screenshot"
      - name: Enable accelerated emulator
        run: if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash .github/scripts/capture373-placement.sh
      - name: Upload exact screenshots from emulator, not mockups
        uses: actions/upload-artifact@v4
        with:
          name: Orivra-373-Native-Placement-Screenshots
          path: placement_screenshots/*.png
          retention-days: 30
          if-no-files-found: error
      - name: Commit screenshots in a visual-QA-only branch for user links
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64,json,pathlib,subprocess,os
          root=pathlib.Path("placement_screenshots")
          expected=["candidate373_settings_buttons.png","candidate373_keyboard_prediction_strip.png"]
          for name in expected:
              file=root/name
              assert file.is_file() and file.stat().st_size>5000,name
              assert file.read_bytes().startswith(b"\x89PNG\r\n\x1a\n"),name
              dest=f"docs/visual-qa/candidate373/{name}"
              payload={
                  "message":f"Native emulator visual QA for Candidate 373: {name}",
                  "content":base64.b64encode(file.read_bytes()).decode("ascii"),
                  "branch":os.environ["GITHUB_REF_NAME"]
              }
              jsonpath=pathlib.Path("/tmp/put-"+name+".json")
              jsonpath.write_text(json.dumps(payload))
              p=subprocess.run(["gh","api","-X","PUT",
                  "repos/"+os.environ["GITHUB_REPOSITORY"]+"/contents/"+dest,
                  "--input",str(jsonpath)],capture_output=True,text=True)
              if p.returncode!=0:
                  raise RuntimeError(f"Failed to publish {name}: {p.stderr[:2000]}")
              print("PUBLISHED native emulator PNG:",dest,"bytes=",file.stat().st_size)
          PY
