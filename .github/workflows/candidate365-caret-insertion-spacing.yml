name: Orivra Candidate 365 - safe mid-sentence word insertion (separate APK)
on:
  push:
    branches:
      - candidate/build365-prediction-tap-insert-word-spacing-20261030
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: orivra-candidate365
  cancel-in-progress: true

jobs:
  source-and-synthetic:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify isolated identity on pinned Research 364
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          base="761bdc2797b58398a4b73ba7de358ec8a7cf05ca"
          changed=set(subprocess.check_output(
              ["git","diff","--name-only",base,"HEAD"],text=True).splitlines())
          allowed={
              "app/build.gradle.kts",
              "app/src/main/java/com/chroomareborn/keyboard/MainActivity.java",
              "app/src/main/java/com/chroomareborn/keyboard/CandidateLatencyMetrics.java",
              "app/src/androidTest/java/com/chroomareborn/keyboard/OfflineLanguagePackAndroidTest.java",
              ".github/workflows/candidate365-caret-insertion-spacing.yml",
          }
          assert changed==allowed, f"Unreviewed files: {changed ^ allowed}"
          old=lambda name: subprocess.check_output(["git","show",base+":"+name],text=True)
          for rel in [
              "app/src/main/java/com/chroomareborn/keyboard/RebornImeService.java",
              "app/src/main/java/com/chroomareborn/keyboard/LongDraftPrediction358.java",
              "app/src/main/java/com/chroomareborn/keyboard/CommittedWordBoundary360.java",
              "app/src/main/java/com/chroomareborn/keyboard/ShortJoinedContext362.java",
              "app/src/main/java/com/chroomareborn/keyboard/PredictionTapCaret364.java",
              "app/src/main/java/com/chroomareborn/keyboard/PredictionLite.java",
              "app/src/main/java/com/chroomareborn/keyboard/PredictionDispatcher.java",
              "app/src/main/java/com/chroomareborn/keyboard/SentenceSuggestionCommit.java",
              "app/src/main/java/com/chroomareborn/keyboard/TypedWordLearningWorker346.java",
          ]:
              assert old(rel)==Path(rel).read_text(),f"Unexpected production change: {rel}"
          build=Path("app/build.gradle.kts").read_text()
          assert 'applicationId = "com.chroomareborn.keyboard.build365trial"' in build
          assert 'versionCode = 365' in build
          assert '"Orivra Candidate 365"' in build
          main=Path("app/src/main/java/com/chroomareborn/keyboard/MainActivity.java").read_text()
          assert "Orivra — Candidate 365 Test" in main
          assert "TypedLearningV4Transfer347.exportV4(this)" in main
          assert "TypedLearningV4Transfer347.importConfirmed(" in main
          metrics=Path("app/src/main/java/com/chroomareborn/keyboard/CandidateLatencyMetrics.java").read_text()
          assert "com.chroomareborn.keyboard.build365trial" in metrics
          pack=Path("app/src/androidTest/java/com/chroomareborn/keyboard/OfflineLanguagePackAndroidTest.java").read_text()
          assert "com.chroomareborn.keyboard.build365trial" in pack
          manifest=Path("app/src/main/AndroidManifest.xml").read_text()
          assert 'android:allowBackup="false"' in manifest
          assert 'android.permission.INTERNET' not in manifest
          assert 'android:usesCleartextTraffic="false"' in manifest
          service=Path("app/src/main/java/com/chroomareborn/keyboard/RebornImeService.java").read_text()
          assert "safeComposing358" in service and "safeIdle358" in service
          assert "CommittedWordBoundary360.resumeWholeWordCorrection(" in service
          assert "PredictionTapCaret364.prefixFirstLetter(" in service
          assert "PredictionTapCaret364.arm(" in service
          assert 'ic.commitText(insertLeftBoundary364?" "+value:value, 1)' in service
          prediction=Path("app/src/main/java/com/chroomareborn/keyboard/PredictionLite.java").read_text()
          assert "ShortJoinedContext362.suggestions(" in prediction
          assert "NeighborDoubleKeyCorrectionPolicy.unique(" in Path("app/src/main/java/com/chroomareborn/keyboard/ShortJoinedContext362.java").read_text()
          assert "final CharSequence beforeKey360=ic.getTextBeforeCursor(1,0);" in service
          assert "SuggestionContinuity353.resumeNextWordsAtDocumentEnd(" in service
          assert "TypedWordsConsent341.enabled(this)" in service
          print("PASS: isolated Trial 365 preserves Candidate 354 typing, privacy and V4 settings")
          PY
      - name: Synthetic prediction-tap spacing, phrase-boundary, long-draft and cursor regressions
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/classes"
          javac -encoding UTF-8 -d "$RUNNER_TEMP/classes" \
            app/src/main/java/com/chroomareborn/keyboard/LongDraftPrediction358.java \
            app/src/main/java/com/chroomareborn/keyboard/CommittedWordBoundary360.java \
            app/src/main/java/com/chroomareborn/keyboard/NeighborDoubleKeyCorrectionPolicy.java \
            app/src/main/java/com/chroomareborn/keyboard/ShortJoinedContext362.java \
            app/src/main/java/com/chroomareborn/keyboard/PredictionTapCaret364.java \
            app/src/testsupport/java/com/chroomareborn/keyboard/LongDraftPrediction358Research.java \
            app/src/testsupport/java/com/chroomareborn/keyboard/CommittedWordBoundary360Research.java \
            app/src/testsupport/java/com/chroomareborn/keyboard/ShortJoinedContext362Research.java \
            app/src/testsupport/java/com/chroomareborn/keyboard/PredictionTapCaret364Research.java
          java -cp "$RUNNER_TEMP/classes" com.chroomareborn.keyboard.LongDraftPrediction358Research
          java -cp "$RUNNER_TEMP/classes" com.chroomareborn.keyboard.CommittedWordBoundary360Research
          java -cp "$RUNNER_TEMP/classes" com.chroomareborn.keyboard.ShortJoinedContext362Research
          java -cp "$RUNNER_TEMP/classes" com.chroomareborn.keyboard.PredictionTapCaret364Research

  android35-qualify-and-release:
    needs: source-and-synthetic
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - uses: actions/checkout@v4
        with:
          repository: en-wl/wordlist
          ref: 1e5b7d3a72f47a71da5d28686c1dd4b397178485
          path: official-esdb
          persist-credentials: false
      - name: Materialize pinned offline English dictionary
        shell: bash
        run: |
          set -euo pipefail
          test -s official-esdb/Copyright
          test -s app/src/main/assets/dictionaries/ESDB_COPYRIGHT.txt
          make -C official-esdb
          (cd official-esdb && ./scowl word-list 60 A 1 --categories=) > "$RUNNER_TEMP/esdb-en.txt"
          printf '%s  %s\n' a5d2f75b95d3530485e539352dc01f9dd9079e03fdaca37466292bf1a360c600 "$RUNNER_TEMP/esdb-en.txt" | sha256sum --check
          mkdir -p app/src/main/assets/dictionaries
          gzip -n -9 < "$RUNNER_TEMP/esdb-en.txt" > app/src/main/assets/dictionaries/esdb-en-US-60.esdbpack
      - name: Build Candidate 365 debug-signed APK and Android tests
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Enable emulator acceleration when available
        run: |
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: gradle --no-daemon --stacktrace :app:connectedDebugAndroidTest
      - name: Verify emulator tests, APK identity and no Internet permission
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree as ET
          files=list(Path('app/build/outputs/androidTest-results/connected').rglob('*.xml'))
          assert files,"Missing emulator reports"
          tests=failed=errors=skipped=0
          for f in files:
              root=ET.parse(f).getroot()
              suites=[root] if root.tag.endswith("testsuite") else [
                  x for x in root.iter() if x.tag.endswith("testsuite")]
              for suite in suites:
                  tests+=int(suite.attrib.get("tests","0"))
                  failed+=int(suite.attrib.get("failures","0"))
                  errors+=int(suite.attrib.get("errors","0"))
                  skipped+=int(suite.attrib.get("skipped","0"))
          print(f'Android 35 emulator: {tests} tests, {failed} failures, {errors} errors, {skipped} skipped')
          assert tests>=202 and failed==0 and errors==0 and skipped==0
          PY
          mkdir -p dist
          apk=$(find app/build/outputs/apk/debug -maxdepth 1 -name '*.apk' -type f -print -quit)
          test -s "$apk"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk" | head -n1 |
            grep -Fq "package: name='com.chroomareborn.keyboard.build365trial' versionCode='365'"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" list "$apk" |
            grep -Fxq 'assets/dictionaries/esdb-en-US-60.esdbpack'
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$apk" > dist/signature.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump permissions "$apk" > dist/permissions.txt
          ! grep -Fq 'android.permission.INTERNET' dist/permissions.txt
          cp "$apk" dist/Orivra-Candidate-365.apk
          (cd dist && sha256sum Orivra-Candidate-365.apk > Orivra-Candidate-365.apk.sha256)
          cat > dist/Release_Notes.txt <<'TXT'
          Orivra Candidate 365 — Prediction tap inserts a new word between existing words PHONE TRIAL

          Separately installable debug-signed package:
          com.chroomareborn.keyboard.build365trial

          - NEW: Select the prediction for a completed cursor word,
            then type a new word before the next existing word. Example:
            "I am hungry" -> tap "am" -> type "not" -> "I am not hungry".
          - First alphabetic key receives one LEFT separator, while the
            original right-side space is preserved. No temporary double
            spaces, and the caret does not jump into the next word.
          - One-shot bounded (48 chars each side) editor/session ticket
            fails closed after cursor movement, selection, private fields,
            punctuation, double spaces, tabs and newlines. No logging.
          - No extra editor reads during ordinary typing: only the first
            key after an explicit cursor-word prediction tap is verified.
          - Built on Candidate 359/361/363, retaining Candidate 354's
            previously phone-tested smooth touch baseline.
          - Fixes Iwikk → I will using existing known word-pair evidence
            and a unique QWERTY-neighbor doubled-key typo; no hardcoded user
            phrase, no automatic correction, and one explicit-tap commit.
          - Also offers an exact missing-space join (Iwill → I will).
          - Keeps known correctly spelled words untouched. Joined-word
            proposals run in the background predictor, never on key down.
          - When a user moves the caret out of a composed word and returns to
            the end of an existing committed word, the next letter is committed
            once and the full word is eligible for correction predictions.
          - Conservative whole-word recovery is gated against selection,
            numeric, protected editors and mid-document text.
          - A known completed composing word without useful alternatives may
            show up to two optional tap-only phrase continuations.
          - After Space at the document end, weak generic suggestions fill
            otherwise empty chips only after existing learned/curated model ranks.
          - Protected fields, selections and mid-document edits remain gated.
          - Normal key touch handling unchanged; extra bounded editor verification only follows an explicit word-chip tap.
          - Backspace, Keep/Search, no-flicker row, safe single-commit choices,
            default-OFF opt-in typed-word learning and V4 backup are retained.
          - No Internet permission, data analytics or automatic app backup.
          - This is not yet phone-tested: Android 35 emulator qualification
            cannot prove Samsung S26 Ultra Android 17 smoothness.
          - Low-confidence fallback is not a pretrained Gboard language model.
          - Test first in a disposable note; keep Candidate 354 installed.
          - A separate APK does not migrate data automatically. Use a manual
            V4 export/import if you want to carry over learning.
          TXT
      - name: Upload verified APK, SHA-256 and signatures
        uses: actions/upload-artifact@v4
        with:
          name: Orivra-Candidate365-Android35-Qualified
          path: dist/
          retention-days: 30
          if-no-files-found: error
      - name: Create prerelease only after full Android qualification
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view candidate-365-20261030 >/dev/null 2>&1; then
            echo "Release already exists; refusing to overwrite"
            exit 1
          fi
          gh release create candidate-365-20261030 \
            dist/Orivra-Candidate-365.apk \
            dist/Orivra-Candidate-365.apk.sha256 \
            --target "$GITHUB_SHA" \
            --title "Orivra Candidate 365 - Safe Mid-Sentence Word Insertion" \
            --notes-file dist/Release_Notes.txt \
            --prerelease
