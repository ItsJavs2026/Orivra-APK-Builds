name: Orivra Candidate 378 - fat-thumb drift and edge letters (separate APK)
on:
  push:
    branches:
      - candidate/build378-fat-thumb-drift-edge-20261030
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: orivra-candidate376
  cancel-in-progress: true

jobs:
  source-and-synthetic:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify isolated identity on pinned Research 375
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          base="2b920e50ed42ddeca76732013b73ec2abcf310ef"
          changed=set(subprocess.check_output(
              ["git","diff","--name-only",base,"HEAD"],text=True).splitlines())
          allowed={
              "app/build.gradle.kts",
              "app/src/main/java/com/chroomareborn/keyboard/MainActivity.java",
              "app/src/main/java/com/chroomareborn/keyboard/CandidateLatencyMetrics.java",
              "app/src/main/java/com/chroomareborn/keyboard/RebornImeService.java",
              "app/src/main/java/com/chroomareborn/keyboard/ThumbTapGuard377.java",
              "app/src/main/java/com/chroomareborn/keyboard/EdgeKeyWeights378.java",
              "app/src/androidTest/java/com/chroomareborn/keyboard/OfflineLanguagePackAndroidTest.java",
              "app/src/androidTest/java/com/chroomareborn/keyboard/ThumbTouch378AndroidTest.java",
              "app/src/testsupport/java/com/chroomareborn/keyboard/ThumbTapGuard377Research.java",
              "app/src/testsupport/java/com/chroomareborn/keyboard/EdgeKeyWeights378Research.java",
              "docs/CANDIDATE378_FAT_THUMB_TRIAL_20261030.md",
              ".github/workflows/candidate378-fat-thumb-geometry.yml",
          }
          assert changed==allowed, f"Unreviewed files: {changed ^ allowed}"
          old=lambda name: subprocess.check_output(["git","show",base+":"+name],text=True)
          for rel in [
              "app/src/main/java/com/chroomareborn/keyboard/LongDraftPrediction358.java",
              "app/src/main/java/com/chroomareborn/keyboard/HighlightedSpace372.java",
              "app/src/main/java/com/chroomareborn/keyboard/LongDraftCaretState375.java",
              "app/src/main/java/com/chroomareborn/keyboard/CommittedWordBoundary360.java",
              "app/src/main/java/com/chroomareborn/keyboard/ShortJoinedContext362.java",
              "app/src/main/java/com/chroomareborn/keyboard/PredictionTapCaret364.java",
              "app/src/main/java/com/chroomareborn/keyboard/PredictionLite.java",
              "app/src/main/java/com/chroomareborn/keyboard/AppPalette.java",
              "app/src/main/java/com/chroomareborn/keyboard/AppSurfaceAccent368.java",
              "app/src/main/java/com/chroomareborn/keyboard/AppIconHueCache366.java",
              "app/src/main/java/com/chroomareborn/keyboard/AppIconColorSignature366.java",
              "app/src/main/java/com/chroomareborn/keyboard/KeyPressVisualPolicy369.java",
              "app/src/main/java/com/chroomareborn/keyboard/SymbolHoldTiming367.java",
              "app/src/main/java/com/chroomareborn/keyboard/PredictionDispatcher.java",
              "app/src/main/java/com/chroomareborn/keyboard/SentenceSuggestionCommit.java",
              "app/src/main/java/com/chroomareborn/keyboard/TypedWordLearningWorker346.java",
          ]:
              assert old(rel)==Path(rel).read_text(),f"Unexpected production change: {rel}"
          build=Path("app/build.gradle.kts").read_text()
          assert 'applicationId = "com.chroomareborn.keyboard.build378trial"' in build
          assert 'versionCode = 378' in build
          assert '"Orivra Candidate 378"' in build
          main=Path("app/src/main/java/com/chroomareborn/keyboard/MainActivity.java").read_text()
          assert "Orivra — Candidate 378 Test" in main
          assert "TypedLearningV4Transfer347.exportV4(this)" in main
          assert "TypedLearningV4Transfer347.importConfirmed(" in main
          metrics=Path("app/src/main/java/com/chroomareborn/keyboard/CandidateLatencyMetrics.java").read_text()
          assert "com.chroomareborn.keyboard.build378trial" in metrics
          pack=Path("app/src/androidTest/java/com/chroomareborn/keyboard/OfflineLanguagePackAndroidTest.java").read_text()
          assert "com.chroomareborn.keyboard.build378trial" in pack
          manifest=Path("app/src/main/AndroidManifest.xml").read_text()
          assert 'android:allowBackup="false"' in manifest
          assert 'android.permission.INTERNET' not in manifest
          assert 'android:usesCleartextTraffic="false"' in manifest
          service=Path("app/src/main/java/com/chroomareborn/keyboard/RebornImeService.java").read_text()
          assert "safeComposing358" in service and "safeIdle358" in service
          assert "CommittedWordBoundary360.resumeWholeWordCorrection(" in service
          assert "PredictionTapCaret364.prefixFirstLetter(" in service
          assert "PredictionTapCaret364.arm(" in service
          assert 'ic.commitText(insertLeftBoundary364?" "+value:value, 1)' in service
          prediction=Path("app/src/main/java/com/chroomareborn/keyboard/PredictionLite.java").read_text()
          assert "ShortJoinedContext362.suggestions(" in prediction
          assert "NeighborDoubleKeyCorrectionPolicy.unique(" in Path("app/src/main/java/com/chroomareborn/keyboard/ShortJoinedContext362.java").read_text()
          assert "final CharSequence beforeKey360=ic.getTextBeforeCursor(1,0);" in service
          assert "SuggestionContinuity353.resumeNextWordsAtDocumentEnd(" in service
          assert "TypedWordsConsent341.enabled(this)" in service
          assert "if(instantKeyFeedback369)return;" in service
          assert "SymbolHoldTiming367.delayMs(" in service
          assert "requestAppIconHue366(editor);" in service
          assert "hintPressOrder353.hasOpenPresses()" in service
          assert "ThumbTapGuard377(" in service
          assert "touchGuard378[0].release(" in service
          assert "EdgeKeyWeights378.weight(" in service
          assert "fatThumbDrift378=visualOptions370.getBoolean(" in service
          assert "wideEdgeLetters378=visualOptions370.getBoolean(" in service
          assert "Thumb drift tolerance:" in main
          assert "Wider edge letters:" in main
          assert "AppSurfaceAccent368.colors(hue,dark)" in Path(
              "app/src/main/java/com/chroomareborn/keyboard/AppPalette.java").read_text()
          assert "Shaded Surface trial" in main
          assert "Swipe prediction selection:" in main
          assert "Space accepts highlighted correction:" in main
          assert "PredictionSwipe372.safeRelease(" in service
          assert "HighlightedSpace372.eligible(" in service
          assert "tryHighlightedSpace372()" in service
          assert "editingInMiddle=LongDraftCaretState375" in service
          assert "afterHostEndedComposition(" in service
          assert 'candidate.startsWith(raw)' in Path("app/src/main/java/com/chroomareborn/keyboard/HighlightedSpace372.java").read_text()
          assert 'option.setOnTouchListener((v,event)->' in service
          assert "Instant key visual feedback:" in main
          assert "Special character hold:" in main
          assert "android.permission.QUERY_ALL_PACKAGES" not in manifest
          assert "android.permission.BIND_ACCESSIBILITY_SERVICE" not in manifest
          print("PASS: isolated Candidate 378 preserves Candidate 373 input behavior, app color, V4, gesture toggles and safety")
          PY
      - name: Synthetic short-space, long-draft, swipe, color and touch regressions
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/classes"
          javac -encoding UTF-8 -d "$RUNNER_TEMP/classes" \
            app/src/main/java/com/chroomareborn/keyboard/LongDraftPrediction358.java \
            app/src/main/java/com/chroomareborn/keyboard/CommittedWordBoundary360.java \
            app/src/main/java/com/chroomareborn/keyboard/NeighborDoubleKeyCorrectionPolicy.java \
            app/src/main/java/com/chroomareborn/keyboard/ShortJoinedContext362.java \
            app/src/main/java/com/chroomareborn/keyboard/PredictionTapCaret364.java \
            app/src/main/java/com/chroomareborn/keyboard/AppSurfaceAccent368.java \
            app/src/main/java/com/chroomareborn/keyboard/AppIconColorSignature366.java \
            app/src/main/java/com/chroomareborn/keyboard/SymbolHoldTiming367.java \
            app/src/main/java/com/chroomareborn/keyboard/KeyPressVisualPolicy369.java \
            app/src/main/java/com/chroomareborn/keyboard/PredictionSwipe372.java \
            app/src/main/java/com/chroomareborn/keyboard/HighlightedSpace372.java \
            app/src/main/java/com/chroomareborn/keyboard/LongDraftCaretState375.java \
            app/src/testsupport/java/com/chroomareborn/keyboard/LongDraftPrediction358Research.java \
            app/src/testsupport/java/com/chroomareborn/keyboard/CommittedWordBoundary360Research.java \
            app/src/testsupport/java/com/chroomareborn/keyboard/ShortJoinedContext362Research.java \
            app/src/testsupport/java/com/chroomareborn/keyboard/PredictionTapCaret364Research.java \
            app/src/testsupport/java/com/chroomareborn/keyboard/AppSurfaceAccent368Research.java \
            app/src/testsupport/java/com/chroomareborn/keyboard/AppIconColorSignature366Research.java \
            app/src/testsupport/java/com/chroomareborn/keyboard/SymbolHoldTiming367Research.java \
            app/src/testsupport/java/com/chroomareborn/keyboard/KeyPressVisualPolicy369Research.java \
            app/src/testsupport/java/com/chroomareborn/keyboard/PredictionSwipe372Research.java \
            app/src/testsupport/java/com/chroomareborn/keyboard/HighlightedSpace372Research.java \
            app/src/testsupport/java/com/chroomareborn/keyboard/LongDraftCaretState375Research.java \
            app/src/main/java/com/chroomareborn/keyboard/HintKeyPressOrder353.java \
            app/src/main/java/com/chroomareborn/keyboard/ThumbTapGuard377.java \
            app/src/main/java/com/chroomareborn/keyboard/EdgeKeyWeights378.java \
            app/src/testsupport/java/com/chroomareborn/keyboard/ThumbTapGuard377Research.java \
            app/src/testsupport/java/com/chroomareborn/keyboard/EdgeKeyWeights378Research.java
          java -cp "$RUNNER_TEMP/classes" com.chroomareborn.keyboard.LongDraftPrediction358Research
          java -cp "$RUNNER_TEMP/classes" com.chroomareborn.keyboard.CommittedWordBoundary360Research
          java -cp "$RUNNER_TEMP/classes" com.chroomareborn.keyboard.ShortJoinedContext362Research
          java -cp "$RUNNER_TEMP/classes" com.chroomareborn.keyboard.PredictionTapCaret364Research
          java -cp "$RUNNER_TEMP/classes" com.chroomareborn.keyboard.AppSurfaceAccent368Research
          java -cp "$RUNNER_TEMP/classes" com.chroomareborn.keyboard.AppIconColorSignature366Research
          java -cp "$RUNNER_TEMP/classes" com.chroomareborn.keyboard.SymbolHoldTiming367Research
          java -cp "$RUNNER_TEMP/classes" com.chroomareborn.keyboard.KeyPressVisualPolicy369Research
          java -cp "$RUNNER_TEMP/classes" com.chroomareborn.keyboard.PredictionSwipe372Research
          java -cp "$RUNNER_TEMP/classes" com.chroomareborn.keyboard.HighlightedSpace372Research
          java -cp "$RUNNER_TEMP/classes" com.chroomareborn.keyboard.LongDraftCaretState375Research
          java -cp "$RUNNER_TEMP/classes" com.chroomareborn.keyboard.ThumbTapGuard377Research
          java -cp "$RUNNER_TEMP/classes" com.chroomareborn.keyboard.EdgeKeyWeights378Research

  android35-qualify-and-release:
    needs: source-and-synthetic
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - uses: actions/checkout@v4
        with:
          repository: en-wl/wordlist
          ref: 1e5b7d3a72f47a71da5d28686c1dd4b397178485
          path: official-esdb
          persist-credentials: false
      - name: Materialize pinned offline English dictionary
        shell: bash
        run: |
          set -euo pipefail
          test -s official-esdb/Copyright
          test -s app/src/main/assets/dictionaries/ESDB_COPYRIGHT.txt
          make -C official-esdb
          (cd official-esdb && ./scowl word-list 60 A 1 --categories=) > "$RUNNER_TEMP/esdb-en.txt"
          printf '%s  %s\n' a5d2f75b95d3530485e539352dc01f9dd9079e03fdaca37466292bf1a360c600 "$RUNNER_TEMP/esdb-en.txt" | sha256sum --check
          mkdir -p app/src/main/assets/dictionaries
          gzip -n -9 < "$RUNNER_TEMP/esdb-en.txt" > app/src/main/assets/dictionaries/esdb-en-US-60.esdbpack
      - name: Build Candidate 378 debug-signed APK and Android tests
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Enable emulator acceleration when available
        run: |
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: gradle --no-daemon --stacktrace :app:connectedDebugAndroidTest
      - name: Verify emulator tests, APK identity and no Internet permission
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree as ET
          files=list(Path('app/build/outputs/androidTest-results/connected').rglob('*.xml'))
          assert files,"Missing emulator reports"
          tests=failed=errors=skipped=0
          for f in files:
              root=ET.parse(f).getroot()
              suites=[root] if root.tag.endswith("testsuite") else [
                  x for x in root.iter() if x.tag.endswith("testsuite")]
              for suite in suites:
                  tests+=int(suite.attrib.get("tests","0"))
                  failed+=int(suite.attrib.get("failures","0"))
                  errors+=int(suite.attrib.get("errors","0"))
                  skipped+=int(suite.attrib.get("skipped","0"))
          print(f'Android 35 emulator: {tests} tests, {failed} failures, {errors} errors, {skipped} skipped')
          assert tests>=234 and failed==0 and errors==0 and skipped==0
          PY
          mkdir -p dist
          apk=$(find app/build/outputs/apk/debug -maxdepth 1 -name '*.apk' -type f -print -quit)
          test -s "$apk"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk" | head -n1 |
            grep -Fq "package: name='com.chroomareborn.keyboard.build378trial' versionCode='378'"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" list "$apk" |
            grep -Fxq 'assets/dictionaries/esdb-en-US-60.esdbpack'
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$apk" > dist/signature.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump permissions "$apk" > dist/permissions.txt
          ! grep -Fq 'android.permission.INTERNET' dist/permissions.txt
          cp "$apk" dist/Orivra-Candidate-378.apk
          (cd dist && sha256sum Orivra-Candidate-378.apk > Orivra-Candidate-378.apk.sha256)
          cat > dist/Release_Notes.txt <<'TXT'
          Orivra Candidate 378 — Fat Thumb Trial (separately installable)

          Package: com.chroomareborn.keyboard.build378trial
          - NEW: Broad-thumb drift tolerance accepts small outbound thumb slips
            from the ORIGINAL pressed letter; large slides, wrong pointers,
            canceled touches and duplicate releases remain rejected.
          - NEW: First and last alphabet letters on each row are slightly
            wider, redistributing width without changing overall row size,
            keyboard height, special keys or active-key boundaries.
          - Preserve Candidate 376's overlapping two-thumb ACTION_DOWN ordering,
            secure-field protections, Space cursor gesture, Backspace, special
            symbol holds, prediction bar, long-draft and short-Space fixes.
          - Separate ON/OFF buttons in app for both thumb experiments.
            Changes take effect on next editor focus, not during keypresses.
          - NO character-key glide typing or top-bar gesture changes in this APK.
          - Android 35 emulator CI is NOT Samsung S26 Ultra Android 17 testing.
          - Keep stable Candidate 354 and Candidate 376 installed. Use a
            disposable note first; no automatic V4 learning migration.
          - No Internet permission, telemetry, or automatic cloud backup.
          TXT
      - name: Upload verified APK, SHA-256 and signatures
        uses: actions/upload-artifact@v4
        with:
          name: Orivra-Candidate378-Android35-Qualified
          path: dist/
          retention-days: 30
          if-no-files-found: error
      - name: Create Candidate 378 prerelease only after full Android qualification
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view candidate-378-20261030 >/dev/null 2>&1; then
            echo "Release already exists; refusing to overwrite"
            exit 1
          fi
          gh release create candidate-378-20261030 \
            dist/Orivra-Candidate-378.apk \
            dist/Orivra-Candidate-378.apk.sha256 \
            --target "$GITHUB_SHA" \
            --title "Orivra Candidate 378 - Fat Thumb Drift and Wider Edge Letters" \
            --notes-file dist/Release_Notes.txt \
            --prerelease
