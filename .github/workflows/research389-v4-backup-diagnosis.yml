name: Orivra Research 389 - local V4 backup safety diagnostics (no APK)
on:
  push:
    branches:
      - research/build389-v4-backup-diagnosis-20261031
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: orivra-research389
  cancel-in-progress: true
jobs:
  android35-readonly-diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Verify no backup codec, store or release mutation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          base='7cf2a9d35aa7d5a4b85b02c326e1af9387236256'
          changes=set(subprocess.check_output(['git','diff','--name-only',base,'HEAD'],text=True).splitlines())
          allowed={
              'app/src/main/java/com/chroomareborn/keyboard/MainActivity.java',
              'app/src/main/java/com/chroomareborn/keyboard/LearningBackupDiagnostic389.java',
              'app/src/androidTest/java/com/chroomareborn/keyboard/LearningBackupDiagnostic389AndroidTest.java',
              'docs/RESEARCH389_BACKUP_DIAGNOSIS_20261031.md',
              '.github/workflows/research389-v4-backup-diagnosis.yml',
          }
          assert changes==allowed,(changes^allowed)
          old=lambda p:subprocess.check_output(['git','show',base+':'+p],text=True)
          for path in [
              'app/src/main/java/com/chroomareborn/keyboard/RebornImeService.java',
              'app/src/main/java/com/chroomareborn/keyboard/TypedLearningV4Codec341.java',
              'app/src/main/java/com/chroomareborn/keyboard/TypedLearningV4Transfer347.java',
              'app/src/main/java/com/chroomareborn/keyboard/LearningTransferStore.java',
              'app/src/main/java/com/chroomareborn/keyboard/LearningTransferDocumentIO.java',
              'app/src/main/java/com/chroomareborn/keyboard/TypedWordEvidenceStore341.java',
              'app/src/main/AndroidManifest.xml',
              'app/build.gradle.kts',
          ]: assert old(path)==Path(path).read_text(),f'Unexpected change: {path}'
          helper=Path('app/src/main/java/com/chroomareborn/keyboard/LearningBackupDiagnostic389.java').read_text()
          assert 'TypedLearningV4Transfer347.preview(ctx,parsed)' in helper
          assert 'TypedLearningV4Transfer347.importConfirmed' not in helper
          assert 'clearAll(' not in helper
          assert 'android.permission.INTERNET' not in Path('app/src/main/AndroidManifest.xml').read_text()
          print('PASS: backup analysis cannot modify or log private learning')
          PY
      - uses: actions/checkout@v4
        with:
          repository: en-wl/wordlist
          ref: 1e5b7d3a72f47a71da5d28686c1dd4b397178485
          path: official-esdb
          persist-credentials: false
      - name: Restore pinned offline dictionary
        shell: bash
        run: |
          set -euo pipefail
          test -s official-esdb/Copyright
          test -s app/src/main/assets/dictionaries/ESDB_COPYRIGHT.txt
          make -C official-esdb
          (cd official-esdb && ./scowl word-list 60 A 1 --categories=) > "$RUNNER_TEMP/esdb-en.txt"
          printf '%s  %s\n' a5d2f75b95d3530485e539352dc01f9dd9079e03fdaca37466292bf1a360c600 "$RUNNER_TEMP/esdb-en.txt" | sha256sum --check
          mkdir -p app/src/main/assets/dictionaries
          gzip -n -9 < "$RUNNER_TEMP/esdb-en.txt" > app/src/main/assets/dictionaries/esdb-en-US-60.esdbpack
      - name: Compile unchanged IME and read-only backup diagnostic tests
        run: gradle --no-daemon --stacktrace :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Enable emulator acceleration
        run: |
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: gradle --no-daemon --stacktrace :app:connectedDebugAndroidTest
      - name: Require at least 251 passing Android tests and zero skips
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree as ET
          reports=list(Path('app/build/outputs/androidTest-results/connected').rglob('*.xml'))
          assert reports,'Missing Android test results'
          tests=failures=errors=skips=0
          for file in reports:
              root=ET.parse(file).getroot()
              suites=[root] if root.tag.endswith('testsuite') else [x for x in root.iter() if x.tag.endswith('testsuite')]
              for suite in suites:
                  tests+=int(suite.attrib.get('tests','0'))
                  failures+=int(suite.attrib.get('failures','0'))
                  errors+=int(suite.attrib.get('errors','0'))
                  skips+=int(suite.attrib.get('skipped','0'))
          print(f'Android 35 emulator: {tests} tests, {failures} failures, {errors} errors, {skips} skipped')
          assert tests>=251 and failures==0 and errors==0 and skips==0
          PY
