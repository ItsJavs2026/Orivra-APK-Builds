name: Orivra Candidate 340 - verified standalone APK prerelease
on:
  push:
    branches:
      - candidate/build340-composing-tap-learning-20261030
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: orivra-candidate340
  cancel-in-progress: true
jobs:
  java-and-privacy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: research/build340-composing-safety-lag-20261030
          path: qualified340
          persist-credentials: false
      - name: Compare exact pinned Research 340 source and protect previous candidates
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C qualified340 rev-parse HEAD)" = "141b6275df50bd8853e9a47503387862b3a4e37e"
          python3 - <<'PY'
          from pathlib import Path
          root=Path('app')
          old=Path('qualified340/app')
          allowed={
              'build.gradle.kts',
              'src/main/java/com/chroomareborn/keyboard/MainActivity.java',
              'src/main/java/com/chroomareborn/keyboard/CandidateLatencyMetrics.java',
              'src/androidTest/java/com/chroomareborn/keyboard/OfflineLanguagePackAndroidTest.java'
          }
          for f in old.rglob('*'):
              if not f.is_file():continue
              rel=f.relative_to(old)
              if rel.as_posix() in allowed:continue
              current=root/rel
              assert current.exists() and current.read_bytes()==f.read_bytes(),f'Source drift: {rel}'
          build=(root/'build.gradle.kts').read_text()
          assert 'applicationId = "com.chroomareborn.keyboard.build340trial"' in build
          assert 'versionCode = 340' in build
          assert '"Orivra Candidate 340"' in build
          assert 'build339trial' not in build
          for p in [
              'src/main/java/com/chroomareborn/keyboard/CandidateLatencyMetrics.java',
              'src/androidTest/java/com/chroomareborn/keyboard/OfflineLanguagePackAndroidTest.java'
          ]:assert 'build340trial' in (root/p).read_text()
          main=(root/'src/main/java/com/chroomareborn/keyboard/MainActivity.java').read_text()
          assert 'Candidate 340 Test' in main
          assert 'LearningTransferStore.exportV3(this)' in main
          assert 'LearningTransferStore.importV3Confirmed(this,parsed)' in main
          assert 'android.permission.INTERNET' not in (root/'src/main/AndroidManifest.xml').read_text()
          print('PASS: Candidate 340 source is pinned, with four metadata-only differences')
          PY
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Check regression files, offline permissions and source wiring
        shell: bash
        run: |
          set -euo pipefail
          root=app/src/main/java/com/chroomareborn/keyboard
          test -s "$root/ComposingMutation340.java"
          test -s "$root/PrefixCandidateCache340.java"
          test -s "$root/PersonalNextWordModel.java"
          test -s "$root/TappedWordBoundary340.java"
          test -s "$root/SessionPhraseDisplay340.java"
          test -s "$root/NextWordTapTicket340.java"
          test -s app/src/androidTest/java/com/chroomareborn/keyboard/ComposingMutation340AndroidTest.java
          test -s app/src/androidTest/java/com/chroomareborn/keyboard/PrefixCandidateCache340AndroidTest.java
          test -s app/src/androidTest/java/com/chroomareborn/keyboard/TappedSequence340AndroidTest.java
          test -s app/src/androidTest/java/com/chroomareborn/keyboard/TappedWordBoundary340AndroidTest.java
          test -s app/src/androidTest/java/com/chroomareborn/keyboard/SessionPhraseDisplay340AndroidTest.java
          test -s app/src/androidTest/java/com/chroomareborn/keyboard/NextWordTapTicket340AndroidTest.java
          grep -Fq 'ComposingMutation340.append(' "$root/RebornImeService.java"
          grep -Fq 'personalizedPrefix340(input)' "$root/RebornImeService.java"
          grep -Fq 'tappedSequence340.observeCommittedWord(' "$root/RebornImeService.java"
          grep -Fq 'LearningTransferStore.exportV3(this)' "$root/MainActivity.java"
          grep -Fq 'LearningTransferStore.importV3Confirmed(this,parsed)' "$root/MainActivity.java"
          ! grep -Fq 'android.permission.INTERNET' app/src/main/AndroidManifest.xml
          ! grep -Fq 'inputSessionGeneration==inputSessionGeneration' "$root/RebornImeService.java"
          mkdir -p "$RUNNER_TEMP/classes"
          javac -encoding UTF-8 -sourcepath app/src/main/java -d "$RUNNER_TEMP/classes" \
            "$root/ComposingMutation340.java" \
            "$root/PrefixCandidateCache340.java" \
            "$root/PersonalNextWordModel.java" \
            "$root/TappedWordBoundary340.java" \
            "$root/SessionPhraseDisplay340.java" \
            "$root/NextWordTapTicket340.java"
          echo 'PASS: pure-Java research classes compile; no new permission or backup schema'

  android35-instrumentation:
    permissions:
      contents: write
    needs: java-and-privacy
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - uses: actions/checkout@v4
        with:
          repository: en-wl/wordlist
          ref: 1e5b7d3a72f47a71da5d28686c1dd4b397178485
          path: official-esdb
          persist-credentials: false
      - name: Materialize pinned offline English dictionary
        shell: bash
        run: |
          set -euo pipefail
          test -s official-esdb/Copyright
          test -s app/src/main/assets/dictionaries/ESDB_COPYRIGHT.txt
          make -C official-esdb
          (cd official-esdb && ./scowl word-list 60 A 1 --categories=) > "$RUNNER_TEMP/esdb-en.txt"
          printf '%s  %s\n' a5d2f75b95d3530485e539352dc01f9dd9079e03fdaca37466292bf1a360c600 "$RUNNER_TEMP/esdb-en.txt" | sha256sum --check
          mkdir -p app/src/main/assets/dictionaries
          gzip -n -9 < "$RUNNER_TEMP/esdb-en.txt" > app/src/main/assets/dictionaries/esdb-en-US-60.esdbpack
      - name: Compile Candidate 340 Android app and test APK
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Enable emulator acceleration when present
        run: |
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: gradle --no-daemon --stacktrace :app:connectedDebugAndroidTest
      - name: Check test report exists
        shell: bash
        run: |
          set -euo pipefail
          test -d app/build/outputs/androidTest-results/connected
          ! grep -R -E '<failure|<error' app/build/outputs/androidTest-results/connected --include='*.xml'
      - name: Upload anonymized test reports only (no APK or user data)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Orivra-Candidate340-TestReports
          path: |
            app/build/outputs/androidTest-results/connected/
            app/build/reports/androidTests/connected/
          retention-days: 7
          if-no-files-found: ignore

      - name: Confirm no instrumentation failures and verify separate APK
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree as ET
          reports=list(Path('app/build/outputs/androidTest-results/connected').rglob('*.xml'))
          count=failed=errors=skipped=0
          for f in reports:
              t=ET.parse(f).getroot()
              suites=[t] if t.tag.endswith('testsuite') else [x for x in t.iter() if x.tag.endswith('testsuite')]
              for x in suites:
                  count+=int(x.attrib.get('tests',0))
                  failed+=int(x.attrib.get('failures',0))
                  errors+=int(x.attrib.get('errors',0))
                  skipped+=int(x.attrib.get('skipped',0))
          print(f'Android35 emulator: {count} tests; {failed} failures; {errors} errors; {skipped} skipped')
          assert count>=91 and failed==0 and errors==0 and skipped==0,'Unqualified instrumentation results'
          PY
          mkdir -p dist
          apk=$(find app/build/outputs/apk/debug -maxdepth 1 -name '*.apk' -type f -print -quit)
          test -s "$apk"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk" | head -n1 |
            grep -Fq "package: name='com.chroomareborn.keyboard.build340trial' versionCode='340'"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" list "$apk" |
            grep -Fxq 'assets/dictionaries/esdb-en-US-60.esdbpack'
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$apk" > dist/signature.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump permissions "$apk" > dist/permissions.txt
          ! grep -Fq 'android.permission.INTERNET' dist/permissions.txt
          cp "$apk" dist/Orivra-Candidate-340.apk
          (cd dist && sha256sum Orivra-Candidate-340.apk > Orivra-Candidate-340.apk.sha256)
          cat > dist/Release_Notes.txt <<'TXT'
          Orivra Candidate 340 - composing safety and tap-learned multiword phrases

          Separate debug-signed com.chroomareborn.keyboard.build340trial package;
          earlier stable builds and Candidates 333/339 are not overwritten.
          - Guards false-but-applied composing writes and stale cursor taps
          - Adds repeated opt-in tap-by-tap sequence/phrase learning in memory
          - Handles standalone I/a, caches personal prefix/split suggestions
          - Adds optional in-memory typed-key latency diagnostics
          - Preserves Backspace 339, Keep/Search Enter, numeric Amount keypad,
            existing V1/V2/V3 backups and no Internet permission

          Qualified on Android 35 emulator only. NOT VERIFIED yet on Samsung
          S26 Ultra Android 17. Newly typed unknown-word sequences remain
          session-only and are NOT in V3 exports. Keep a V3 backup and older
          installed APK before testing; manually import V3 into this package.
          TXT
      - name: Upload APK, SHA256 and signature report
        uses: actions/upload-artifact@v4
        with:
          name: Orivra-Candidate-340-Android35-Passed
          path: dist/
          retention-days: 30
          if-no-files-found: error
      - name: Create prerelease only after successful emulator qualification
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view candidate-340-20261030 >/dev/null 2>&1; then
            echo 'Release already exists; refusing to overwrite'
            exit 1
          fi
          gh release create candidate-340-20261030 \
            dist/Orivra-Candidate-340.apk \
            dist/Orivra-Candidate-340.apk.sha256 \
            --target "$GITHUB_SHA" \
            --title "Orivra Candidate 340 - Composing Safety and Tap-Learned Phrases" \
            --notes-file dist/Release_Notes.txt \
            --prerelease
