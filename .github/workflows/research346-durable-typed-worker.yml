name: Orivra Research 346 - durable typed word worker (no live IME integration)
on:
  push:
    branches:
      - research/build346-durable-typed-words-20261030
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: orivra-research346
  cancel-in-progress: true
jobs:
  java-and-privacy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: candidate/build345-video-proven-normal-strip-flicker-20261030
          path: frozen345
          persist-credentials: false
      - name: Verify Candidate 345 exact source remains unchanged
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C frozen345 rev-parse HEAD)" = "58abd086bbacb5b900a0fccb951a4aaaaf0d3997"
          python3 - <<'PY'
          from pathlib import Path
          old=Path('frozen345/app')
          root=Path('app')
          for f in old.rglob('*'):
              if not f.is_file():continue
              rel=f.relative_to(old)
              current=root/rel
              assert current.exists() and f.read_bytes()==current.read_bytes(),f'Baseline drift: {rel}'
          stem=root/'src/main/java/com/chroomareborn/keyboard'
          service=(stem/'RebornImeService.java').read_text()
          main=(stem/'MainActivity.java').read_text()
          manifest=(root/'src/main/AndroidManifest.xml').read_text()
          for marker in ['TypedWordLearningWorker346','TypedWordBoundaryStore346','TypedWordsConsent341']:
              assert marker not in service,'Unapproved live IME integration: '+marker
              assert marker not in main,'Unapproved user-facing setting: '+marker
          assert 'LearningTransferStore.exportV3(this)' in main
          assert 'LearningTransferStore.importV3Confirmed(this,parsed)' in main
          assert 'android.permission.INTERNET' not in manifest
          assert 'android:allowBackup="false"' in manifest
          assert (stem/'TypedWordLearningWorker346.java').is_file()
          assert (stem/'TypedWordBoundaryStore346.java').is_file()
          assert (stem/'TypedWordEvidenceStore341.java').is_file()
          assert (stem/'TypedLearningV4Codec341.java').is_file()
          assert (root/'src/androidTest/java/com/chroomareborn/keyboard/TypedWordLearningWorker346AndroidTest.java').is_file()
          print('PASS: Candidate 345 IME and settings are byte-identical to phone-tested baseline; default-off research only')
          PY
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Validate boundaries and consent epoch protection
        shell: bash
        run: |
          set -euo pipefail
          root=app/src/main/java/com/chroomareborn/keyboard
          grep -Fq 'consent_generation_346' "$root/TypedWordsConsent341.java"
          grep -Fq 'TypedWordsConsent341.generation(c)!=capturedConsentGeneration' "$root/TypedWordBoundaryStore346.java"
          grep -Fq 'TypedWordEvidenceStore341.class' "$root/TypedWordBoundaryStore346.java"
          grep -Fq 'Thread.currentThread()==Looper.getMainLooper().getThread()' "$root/TypedWordBoundaryStore346.java"
          grep -Fq 'worker.shutdown();' "$root/TypedWordLearningWorker346.java"
          ! grep -Fq 'android.permission.INTERNET' app/src/main/AndroidManifest.xml
          echo 'PASS: consent epoch, private store serialization and background worker guard'
  android35-instrumentation:
    needs: java-and-privacy
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - uses: actions/checkout@v4
        with:
          repository: en-wl/wordlist
          ref: 1e5b7d3a72f47a71da5d28686c1dd4b397178485
          path: official-esdb
          persist-credentials: false
      - name: Materialize pinned offline English dictionary
        shell: bash
        run: |
          set -euo pipefail
          test -s official-esdb/Copyright
          test -s app/src/main/assets/dictionaries/ESDB_COPYRIGHT.txt
          make -C official-esdb
          (cd official-esdb && ./scowl word-list 60 A 1 --categories=) > "$RUNNER_TEMP/esdb-en.txt"
          printf '%s  %s\n' a5d2f75b95d3530485e539352dc01f9dd9079e03fdaca37466292bf1a360c600 "$RUNNER_TEMP/esdb-en.txt" | sha256sum --check
          mkdir -p app/src/main/assets/dictionaries
          gzip -n -9 < "$RUNNER_TEMP/esdb-en.txt" > app/src/main/assets/dictionaries/esdb-en-US-60.esdbpack
      - name: Compile research 346 Java and Android tests
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Enable emulator acceleration when present
        run: |
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: gradle --no-daemon --stacktrace :app:connectedDebugAndroidTest
      - name: Check test report exists
        shell: bash
        run: |
          set -euo pipefail
          test -d app/build/outputs/androidTest-results/connected
          ! grep -R -E '<failure|<error' app/build/outputs/androidTest-results/connected --include='*.xml'
      - name: Upload anonymized test reports only (no APK or user data)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Orivra-Research346-TestReports
          path: |
            app/build/outputs/androidTest-results/connected/
            app/build/reports/androidTests/connected/
          retention-days: 7
          if-no-files-found: ignore

      - name: Verify all Android regression tests; do not publish an APK
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree as ET
          reports=list(Path('app/build/outputs/androidTest-results/connected').rglob('*.xml'))
          count=failed=errors=skipped=0
          for f in reports:
              root=ET.parse(f).getroot()
              suites=[root] if root.tag.endswith('testsuite') else [
                  x for x in root.iter() if x.tag.endswith('testsuite')]
              for x in suites:
                  count+=int(x.attrib.get('tests',0))
                  failed+=int(x.attrib.get('failures',0))
                  errors+=int(x.attrib.get('errors',0))
                  skipped+=int(x.attrib.get('skipped',0))
          print(f'Research 346 Android 35 emulator: {count} tests, {failed} failures, {errors} errors, {skipped} skips')
          assert count>=120 and failed==0 and errors==0 and skipped==0,'Unqualified tests'
          PY
          echo 'PASS: Research 346 qualified. No distributable APK created; Candidate 345 remains stable.'
