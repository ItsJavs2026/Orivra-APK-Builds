name: Orivra Research 353 - continuous tap-to-space predictions and two-thumb ordering (no APK)
on:
  push:
    branches:
      - research/build353-prediction-continuity-space-20261030
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: orivra-research353
  cancel-in-progress: true
jobs:
  java-and-privacy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: candidate/build352-selected-caret-safety-20261030
          path: frozen352
          persist-credentials: false
      - name: Freeze Candidate 352 while testing suggestion spacing, cursor center and key overlap
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C frozen352 rev-parse HEAD)" = "b9a0b0d6d3610556b4bbdfe5ea9239d9176d762c"
          python3 - <<'PY'
          from pathlib import Path
          old=Path('frozen352/app')
          root=Path('app')
          allowed={
              'src/main/java/com/chroomareborn/keyboard/RebornImeService.java',
              'src/main/java/com/chroomareborn/keyboard/CursorWordCorrectionPolicy.java',
              'src/main/java/com/chroomareborn/keyboard/SentenceSuggestionCommit.java'
          }
          for f in old.rglob('*'):
              if not f.is_file():continue
              rel=f.relative_to(old)
              current=root/rel
              assert current.exists(),f'Missing Candidate 352 baseline: {rel}'
              if rel.as_posix() in allowed:continue
              assert current.read_bytes()==f.read_bytes(),f'Unapproved baseline drift: {rel}'
          src=root/'src/main/java/com/chroomareborn/keyboard'
          service=(src/'RebornImeService.java').read_text()
          assert 'SuggestionContinuity353.centerCurrentWord(input,options)' in service
          assert 'SuggestionContinuity353.resumeNextWordsAtDocumentEnd(' in service
          assert 'plan.replacement+plan.trailingSeparator' in service
          assert 'HintKeyPressOrder353 hintPressOrder353' in service
          assert 'SuggestionContinuity353.splitNextWordsOnlyDuringLiveComposition(' in service
          assert 'hintPressOrder353.complete(' in service
          assert 'event.findPointerIndex(primaryPointer[0])' in service
          assert 'refreshAfterHint353=true' in service
          assert 'PredictionStripContinuity345.holdVisualOnly(option)' in service
          assert 'renderImmediateSuggestions345(snapshot,' in service
          assert 'typedWords347.committedSpace(verified347,session,true,true)' in service
          assert (src/'SelectionCommitRecovery351.java').exists()
          assert 'debounceMillisFor(snapshot,editing)' in (src/'PredictionDispatcher.java').read_text()
          assert 'SuggestionContinuity353.spaceAfter(suffix)' in (src/'CursorWordCorrectionPolicy.java').read_text()
          assert 'SuggestionContinuity353.spaceAfter(following)' in (src/'SentenceSuggestionCommit.java').read_text()
          for name in ['SuggestionContinuity353.java','HintKeyPressOrder353.java']:
              assert (src/name).exists()
          for name in ['SuggestionContinuity353AndroidTest.java','HintKeyPressOrder353AndroidTest.java']:
              assert (root/'src/androidTest/java/com/chroomareborn/keyboard'/name).exists()
          manifest=(root/'src/main/AndroidManifest.xml').read_text()
          assert 'android.permission.INTERNET' not in manifest
          assert 'android:allowBackup="false"' in manifest
          build=(root/'build.gradle.kts').read_text()
          assert 'build352trial' in build and 'versionCode = 352' in build
          print('PASS: Candidate 350 latency and 352 selection safety frozen; only focused research 353 classes changed')
          PY
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Validate separator, center word, long draft recovery and touch-order controls
        shell: bash
        run: |
          set -euo pipefail
          root=app/src/main/java/com/chroomareborn/keyboard
          grep -Fq 'SuggestionContinuity353.centerCurrentWord(input,options)' "$root/RebornImeService.java"
          grep -Fq 'HintKeyPressOrder353 hintPressOrder353' "$root/RebornImeService.java"
          grep -Fq 'SuggestionContinuity353.spaceAfter(following)' "$root/SentenceSuggestionCommit.java"
          grep -Fq 'debounceMillisFor(snapshot,editing)' "$root/PredictionDispatcher.java"
          test -s "$root/SuggestionContinuity353.java"
          test -s "$root/HintKeyPressOrder353.java"
          test -s app/src/androidTest/java/com/chroomareborn/keyboard/SuggestionContinuity353AndroidTest.java
          test -s app/src/androidTest/java/com/chroomareborn/keyboard/HintKeyPressOrder353AndroidTest.java
          ! grep -Fq 'android.permission.INTERNET' app/src/main/AndroidManifest.xml
          echo 'PASS: word boundaries, stable three chips, Android touch overlap and existing 350 timing unchanged'
  android35-instrumentation:
    needs: java-and-privacy
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - uses: actions/checkout@v4
        with:
          repository: en-wl/wordlist
          ref: 1e5b7d3a72f47a71da5d28686c1dd4b397178485
          path: official-esdb
          persist-credentials: false
      - name: Materialize pinned offline English dictionary
        shell: bash
        run: |
          set -euo pipefail
          test -s official-esdb/Copyright
          test -s app/src/main/assets/dictionaries/ESDB_COPYRIGHT.txt
          make -C official-esdb
          (cd official-esdb && ./scowl word-list 60 A 1 --categories=) > "$RUNNER_TEMP/esdb-en.txt"
          printf '%s  %s\n' a5d2f75b95d3530485e539352dc01f9dd9079e03fdaca37466292bf1a360c600 "$RUNNER_TEMP/esdb-en.txt" | sha256sum --check
          mkdir -p app/src/main/assets/dictionaries
          gzip -n -9 < "$RUNNER_TEMP/esdb-en.txt" > app/src/main/assets/dictionaries/esdb-en-US-60.esdbpack
      - name: Compile research 353 Java and Android tests
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Enable emulator acceleration when present
        run: |
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: gradle --no-daemon --stacktrace :app:connectedDebugAndroidTest
      - name: Check test report exists
        shell: bash
        run: |
          set -euo pipefail
          test -d app/build/outputs/androidTest-results/connected
          ! grep -R -E '<failure|<error' app/build/outputs/androidTest-results/connected --include='*.xml'
      - name: Upload anonymized test reports only (no APK or user data)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Orivra-Research353-TestReports
          path: |
            app/build/outputs/androidTest-results/connected/
            app/build/reports/androidTests/connected/
          retention-days: 7
          if-no-files-found: ignore

      - name: Verify all Android regression tests; do not publish an APK
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree as ET
          reports=list(Path('app/build/outputs/androidTest-results/connected').rglob('*.xml'))
          count=failed=errors=skipped=0
          for f in reports:
              root=ET.parse(f).getroot()
              suites=[root] if root.tag.endswith('testsuite') else [
                  x for x in root.iter() if x.tag.endswith('testsuite')]
              for x in suites:
                  count+=int(x.attrib.get('tests',0))
                  failed+=int(x.attrib.get('failures',0))
                  errors+=int(x.attrib.get('errors',0))
                  skipped+=int(x.attrib.get('skipped',0))
          print(f'Research 353 Android 35 emulator: {count} tests, {failed} failures, {errors} errors, {skipped} skips')
          assert count>=182 and failed==0 and errors==0 and skipped==0,'Unqualified tests'
          PY
          echo 'PASS: Research 353 qualified. No APK published; Candidate 350 and 352 remain untouched.'
