name: Orivra Research 388 - idle next-word letter-row swipes (no APK)
on:
  push:
    branches:
      - research/build388-idle-nextword-letter-row-20261031
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: orivra-research388
  cancel-in-progress: true
jobs:
  idle-swipe-synthetic:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Protect installed Candidate 386
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          base='f88b21923fab5c5b70863089a46ed6e2720834b6'
          files=set(subprocess.check_output(['git','diff','--name-only',base,'HEAD'],text=True).splitlines())
          allowed={
              'app/src/main/java/com/chroomareborn/keyboard/RebornImeService.java',
              'app/src/main/java/com/chroomareborn/keyboard/LetterRowIdleMode388.java',
              'app/src/androidTest/java/com/chroomareborn/keyboard/LetterRowIdle388AndroidTest.java',
              'app/src/testsupport/java/com/chroomareborn/keyboard/LetterRowIdleMode388Research.java',
              'docs/RESEARCH388_IDLE_LETTER_ROW_20261031.md',
              '.github/workflows/research388-idle-letter-row.yml',
          }
          assert files==allowed,(files^allowed)
          service=Path('app/src/main/java/com/chroomareborn/keyboard/RebornImeService.java').read_text()
          assert 'nextWordTicketCurrent340(pressEditor[0])' in service
          assert 'LetterRowIdleMode388.finish(' in service
          assert 'acceptSuggestion(key,expected386,selectedRow386)' in service
          build=Path('app/build.gradle.kts').read_text()
          assert 'applicationId = "com.chroomareborn.keyboard.build386trial"' in build
          assert 'versionCode = 386' in build
          assert 'android.permission.INTERNET' not in Path('app/src/main/AndroidManifest.xml').read_text()
          print('PASS: research only; installed Candidate 386 unchanged')
          PY
      - name: Run 80000 offline idle swipe cases
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/idle388"
          javac -encoding UTF-8 -d "$RUNNER_TEMP/idle388" \
            app/src/main/java/com/chroomareborn/keyboard/PredictionSwipe372.java \
            app/src/main/java/com/chroomareborn/keyboard/LetterRowPredictionSwipe386.java \
            app/src/main/java/com/chroomareborn/keyboard/LetterRowIdleMode388.java \
            app/src/testsupport/java/com/chroomareborn/keyboard/LetterRowIdleMode388Research.java
          java -cp "$RUNNER_TEMP/idle388" \
            com.chroomareborn.keyboard.LetterRowIdleMode388Research
  android35-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - uses: actions/checkout@v4
        with:
          repository: en-wl/wordlist
          ref: 1e5b7d3a72f47a71da5d28686c1dd4b397178485
          path: official-esdb
          persist-credentials: false
      - name: Restore pinned offline dictionary
        shell: bash
        run: |
          set -euo pipefail
          test -s official-esdb/Copyright
          test -s app/src/main/assets/dictionaries/ESDB_COPYRIGHT.txt
          make -C official-esdb
          (cd official-esdb && ./scowl word-list 60 A 1 --categories=) > "$RUNNER_TEMP/esdb-en.txt"
          printf '%s  %s\n' a5d2f75b95d3530485e539352dc01f9dd9079e03fdaca37466292bf1a360c600 "$RUNNER_TEMP/esdb-en.txt" | sha256sum --check
          mkdir -p app/src/main/assets/dictionaries
          gzip -n -9 < "$RUNNER_TEMP/esdb-en.txt" > app/src/main/assets/dictionaries/esdb-en-US-60.esdbpack
      - name: Build unchanged trial identity and expanded instrumentation
        run: gradle --no-daemon --stacktrace :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Enable emulator acceleration
        run: |
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: gradle --no-daemon --stacktrace :app:connectedDebugAndroidTest
      - name: Confirm at least 255 passing Android tests
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree as ET
          reports=list(Path('app/build/outputs/androidTest-results/connected').rglob('*.xml'))
          assert reports,'Missing Android test report'
          tests=failures=errors=skips=0
          for report in reports:
              root=ET.parse(report).getroot()
              suites=[root] if root.tag.endswith('testsuite') else [x for x in root.iter() if x.tag.endswith('testsuite')]
              for s in suites:
                  tests+=int(s.attrib.get('tests','0'))
                  failures+=int(s.attrib.get('failures','0'))
                  errors+=int(s.attrib.get('errors','0'))
                  skips+=int(s.attrib.get('skipped','0'))
          print(f'Android 35 emulator: {tests} tests, {failures} failures, {errors} errors, {skips} skipped')
          assert tests>=255 and failures==0 and errors==0 and skips==0
          PY
