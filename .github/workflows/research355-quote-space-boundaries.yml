name: Orivra Research 355 - quote and Unicode spacing regression (NO APK)
on:
  push:
    branches:
      - research/build355-quote-space-boundaries-20261030
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: orivra-research355
  cancel-in-progress: true

jobs:
  offline-boundaries:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Protect published Candidate 354 and reject unrelated changes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import subprocess
          from pathlib import Path
          base="378af284207b02c3fb50bbeab273aaede6648837"
          changed=set(subprocess.check_output(
              ["git","diff","--name-only",base,"HEAD"],text=True).splitlines())
          allowed={
              "app/src/main/java/com/chroomareborn/keyboard/SuggestionContinuity353.java",
              "app/src/testsupport/java/com/chroomareborn/keyboard/SuggestionBoundary355Research.java",
              "app/src/androidTest/java/com/chroomareborn/keyboard/SuggestionBoundary355AndroidTest.java",
              ".github/workflows/research355-quote-space-boundaries.yml"
          }
          assert changed==allowed, f"Unexpected source drift: {changed ^ allowed}"
          source=Path("app/src/main/java/com/chroomareborn/keyboard/SuggestionContinuity353.java").read_text()
          assert "Character.isSpaceChar(cp)" in source
          assert "cp" in source
          assert not any("Candidate 355" in line for line in source.splitlines())
          manifest=Path("app/src/main/AndroidManifest.xml").read_text()
          assert "android.permission.INTERNET" not in manifest
          gradle=Path("app/build.gradle.kts").read_text()
          assert 'applicationId = "com.chroomareborn.keyboard.build354trial"' in gradle
          print("PASS: four reviewed research-only files; Candidate 354 app ID unchanged")
          PY
      - name: Compile and run 20,000-case synthetic boundary regression
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/classes"
          javac -encoding UTF-8 -d "$RUNNER_TEMP/classes" \
            app/src/main/java/com/chroomareborn/keyboard/SuggestionContinuity353.java \
            app/src/testsupport/java/com/chroomareborn/keyboard/SuggestionBoundary355Research.java
          java -cp "$RUNNER_TEMP/classes" \
            com.chroomareborn.keyboard.SuggestionBoundary355Research
          echo "Research only: no APK, no signing, no release, no Samsung validation"
