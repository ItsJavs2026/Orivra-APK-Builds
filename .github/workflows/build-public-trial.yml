name: Orivra Build 291 Safe Enter - manual qualification
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Check package, permissions, assets and prohibited files
        shell: bash
        run: |
          set -euo pipefail
          test -s app/src/main/AndroidManifest.xml
          test -s app/src/main/java/com/chroomareborn/keyboard/RebornImeService.java
          test -s third_party/swiftfloris/LICENSE
          test -s third_party/swiftfloris/NOTICE
          grep -Fq 'com.chroomareborn.keyboard.build291trial' app/build.gradle.kts
          if grep -Fq 'android.permission.INTERNET' app/src/main/AndroidManifest.xml; then exit 1; fi
          if git ls-files | grep -Ei '(^research/|^evaluation/|^scripts/|^app/src/debug/|\.(jks|keystore|p12|pem|pfx|key)$)'; then exit 1; fi
      - name: Java 17 layout, haptics, suggestion and cursor regression tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/orivra-classes"
          javac -d "$RUNNER_TEMP/orivra-classes" \
            app/src/main/java/com/chroomareborn/keyboard/KeyboardLayoutSpec.java \
            app/src/main/java/com/chroomareborn/keyboard/EnterKeyPolicy.java \
            app/src/main/java/com/chroomareborn/keyboard/KeyboardHapticStyle.java \
            app/src/main/java/com/chroomareborn/keyboard/SuggestionStripLayoutPolicy.java \
            app/src/main/java/com/chroomareborn/keyboard/PunctuationSpacing.java \
            app/src/main/java/com/chroomareborn/keyboard/CursorWordCorrectionPolicy.java \
            app/src/main/java/com/chroomareborn/keyboard/SpacebarCursorGesture.java \
            app/src/main/java/com/chroomareborn/keyboard/CursorSwipeBatch.java \
            app/src/main/java/com/chroomareborn/keyboard/CursorMovementPolicy.java \
            app/src/main/java/com/chroomareborn/keyboard/CursorReleaseSuggestionPolicy.java \
            app/src/main/java/com/chroomareborn/keyboard/CursorFallbackBoundaryPolicy.java \
            app/src/testsupport/java/com/chroomareborn/keyboard/KeyboardLayoutSpecTest.java \
            app/src/testsupport/java/com/chroomareborn/keyboard/EnterKeyPolicyTest.java \
            app/src/testsupport/java/com/chroomareborn/keyboard/KeyboardHapticStyleTest.java \
            app/src/testsupport/java/com/chroomareborn/keyboard/SuggestionStripLayoutPolicyTest.java \
            app/src/testsupport/java/com/chroomareborn/keyboard/PunctuationSpacingTest.java \
            app/src/testsupport/java/com/chroomareborn/keyboard/CursorWordCorrectionPolicyTest.java \
            app/src/testsupport/java/com/chroomareborn/keyboard/SpacebarCursorGestureTest.java \
            app/src/testsupport/java/com/chroomareborn/keyboard/CursorSwipeBatchTest.java \
            app/src/testsupport/java/com/chroomareborn/keyboard/CursorReleaseSuggestionPolicyTest.java \
            app/src/testsupport/java/com/chroomareborn/keyboard/CursorFallbackBoundaryPolicyTest.java
          for case in EnterKeyPolicyTest KeyboardLayoutSpecTest KeyboardHapticStyleTest SuggestionStripLayoutPolicyTest PunctuationSpacingTest CursorWordCorrectionPolicyTest SpacebarCursorGestureTest CursorSwipeBatchTest CursorReleaseSuggestionPolicyTest CursorFallbackBoundaryPolicyTest; do
            java -ea -cp "$RUNNER_TEMP/orivra-classes" "com.chroomareborn.keyboard.$case"
          done
      - name: Install Android SDK 35
        shell: bash
        run: |
          set -euo pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install 'platforms;android-35' 'build-tools;35.0.0' 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compile Android debug APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Verify APK signature, ID, permissions, hash
        shell: bash
        run: |
          set -euo pipefail
          apk=$(find app/build/outputs/apk/debug -maxdepth 1 -name '*.apk' -print -quit)
          test -s "$apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs --verbose "$apk" | tee apk-signature.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk" | head -n 1 | tee apk-identity.txt
          grep -Fq "package: name='com.chroomareborn.keyboard.build291trial' versionCode='291'" apk-identity.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump permissions "$apk" | tee apk-permissions.txt
          if grep -Fq 'android.permission.INTERNET' apk-permissions.txt; then exit 1; fi
          sha256sum "$apk" | tee apk-sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Orivra-Build291-Safe-Enter-Experimental-APK
          path: |
            app/build/outputs/apk/debug/*.apk
            apk-signature.txt
            apk-identity.txt
            apk-permissions.txt
            apk-sha256.txt
          retention-days: 7
          if-no-files-found: error
