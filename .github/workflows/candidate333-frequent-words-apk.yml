name: Orivra Candidate 333 - frequent-word learning and V3 backups APK
on:
  push:
    branches:
      - candidate/build333-frequent-words-v3-20261030
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: orivra-candidate333-release
  cancel-in-progress: true
jobs:
  qualified-source-and-java:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: research/build332-prefix-latency-20261030
          path: qualified333
          persist-credentials: false
      - name: Verify source is pinned and only package metadata changed
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C qualified333 rev-parse HEAD)" = "6269392c7108490e92f3055bfa704691bb799b72"
          ! grep -Fq 'android.permission.INTERNET' app/src/main/AndroidManifest.xml
          test -s app/src/androidTest/java/com/chroomareborn/keyboard/PersonalContextLearning319AndroidTest.java
          test -s app/src/androidTest/java/com/chroomareborn/keyboard/NumericKeypad323AndroidTest.java
          test -s app/src/androidTest/java/com/chroomareborn/keyboard/ContextBackupTransfer325AndroidTest.java
          test -s app/src/androidTest/java/com/chroomareborn/keyboard/LearningTransferStoreAndroidTest.java
          grep -Fq 'LearningTransferDocumentIO.createContextIntent()' app/src/main/java/com/chroomareborn/keyboard/MainActivity.java
          grep -Fq 'orivra-context-learning-v2-backup.txt' app/src/main/java/com/chroomareborn/keyboard/LearningTransferDocumentIO.java
          grep -Fq 'LearningTransferStore.exportV2(this)' app/src/main/java/com/chroomareborn/keyboard/MainActivity.java
          grep -Fq 'LearningTransferStore.importV3Confirmed(this,parsed)' app/src/main/java/com/chroomareborn/keyboard/MainActivity.java
          grep -Fq 'FrequencyBackupFormat330.decode(file)' app/src/main/java/com/chroomareborn/keyboard/MainActivity.java
          grep -Fq 'LearningTransferStore.exportV3(this)' app/src/main/java/com/chroomareborn/keyboard/MainActivity.java
          grep -Fq 'orivra-word-frequency-v3-backup.txt' app/src/main/java/com/chroomareborn/keyboard/LearningTransferDocumentIO.java
          test -s app/src/androidTest/java/com/chroomareborn/keyboard/FrequencyTransfer331AndroidTest.java
          test -s app/src/androidTest/java/com/chroomareborn/keyboard/PersonalPrefix328AndroidTest.java
          grep -Fq 'StableWordUsagePolicy329.sameVisibleWord' app/src/main/java/com/chroomareborn/keyboard/RebornImeService.java
          grep -Fq 'LearningTransferStore.exportText(this)' app/src/main/java/com/chroomareborn/keyboard/MainActivity.java
          grep -Fq 'renderNumericKeypad323(heightMode,landscape)' app/src/main/java/com/chroomareborn/keyboard/RebornImeService.java
          test -s app/src/androidTest/java/com/chroomareborn/keyboard/AdaptiveUsedWord321AndroidTest.java
          test -s app/src/testsupport/java/com/chroomareborn/keyboard/ContextBackupFormat322Test.java
          grep -Fq 'PersonalContextLearning319.recordUsed(this' app/src/main/java/com/chroomareborn/keyboard/RebornImeService.java
          python3 - <<'PY'
          from pathlib import Path
          root=Path('app')
          previous=Path('qualified333/app')
          allowed={
            'src/main/java/com/chroomareborn/keyboard/MainActivity.java',
            'src/main/java/com/chroomareborn/keyboard/CandidateLatencyMetrics.java',
            'src/androidTest/java/com/chroomareborn/keyboard/OfflineLanguagePackAndroidTest.java',
          }
          for folder in ['src/main/java','src/testsupport','src/androidTest']:
              for f in (previous/folder).rglob('*.java'):
                  rel=f.relative_to(previous).as_posix()
                  if rel in allowed:continue
                  assert f.read_bytes()==(root/rel).read_bytes(),f'Unexpected source drift: {rel}'
          for f in ['src/main/AndroidManifest.xml','src/main/assets/dictionaries/ESDB_COPYRIGHT.txt']:
              assert (previous/f).read_bytes()==(root/f).read_bytes(),f'Unexpected privacy/license drift: {f}'
          gradle=(root/'build.gradle.kts').read_text()
          assert 'applicationId = "com.chroomareborn.keyboard.build333trial"' in gradle
          assert 'versionCode = 333' in gradle
          assert '"Orivra Candidate 333"' in gradle
          assert 'build310trial' not in gradle
          for key in ['src/main/java/com/chroomareborn/keyboard/CandidateLatencyMetrics.java',
                      'src/androidTest/java/com/chroomareborn/keyboard/OfflineLanguagePackAndroidTest.java']:
              assert 'build333trial' in (root/key).read_text()
              assert 'build310trial' not in (root/key).read_text()
          assert 'Candidate 333' in (root/'src/main/java/com/chroomareborn/keyboard/MainActivity.java').read_text()
          print('PASS: version 327 isolated, pinned source, no extra permissions')
          PY
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Re-run contextual learning and general English Java tests
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/classes"
          javac -encoding UTF-8 -sourcepath app/src/main/java:app/src/testsupport/java \
            -d "$RUNNER_TEMP/classes" \
            app/src/main/java/com/chroomareborn/keyboard/PredictionLite.java \
            app/src/testsupport/java/com/chroomareborn/keyboard/PredictionSmokeTest.java \
            app/src/testsupport/java/com/chroomareborn/keyboard/NumericKeypadPolicy323Test.java \
            app/src/testsupport/java/com/chroomareborn/keyboard/AdaptiveUsagePolicy321Test.java \
            app/src/testsupport/java/com/chroomareborn/keyboard/ContextBackupFormat322Test.java \
            app/src/testsupport/java/com/chroomareborn/keyboard/FrequencyBackup330Test.java \
            app/src/testsupport/java/com/chroomareborn/keyboard/AdaptivePrefix328Test.java \
            app/src/testsupport/java/com/chroomareborn/keyboard/StableWordUsage329Test.java \
            app/src/testsupport/java/com/chroomareborn/keyboard/EverydayEnglishCoverageAudit316.java \
            app/src/testsupport/java/com/chroomareborn/keyboard/NeighborDoubleKey315Test.java \
            app/src/testsupport/java/com/chroomareborn/keyboard/JoinedEnglishContraction314Test.java \
            app/src/testsupport/java/com/chroomareborn/keyboard/AcceptedContext319PolicyTest.java \
            app/src/testsupport/java/com/chroomareborn/keyboard/TypingMotionPolicyTest.java \
            app/src/testsupport/java/com/chroomareborn/keyboard/EnglishApostropheAndLearningV2Test.java
          for test in FrequencyBackup330Test AdaptivePrefix328Test StableWordUsage329Test AdaptiveUsagePolicy321Test ContextBackupFormat322Test NumericKeypadPolicy323Test PredictionSmokeTest NeighborDoubleKey315Test JoinedEnglishContraction314Test AcceptedContext319PolicyTest TypingMotionPolicyTest EnglishApostropheAndLearningV2Test; do
            java -Xmx512m -ea -cp "$RUNNER_TEMP/classes" "com.chroomareborn.keyboard.$test"
          done
          java -Xmx512m -ea -cp "$RUNNER_TEMP/classes" \
            com.chroomareborn.keyboard.EverydayEnglishCoverageAudit316 --gate

  android35-build-sign-release:
    needs: qualified-source-and-java
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - uses: actions/checkout@v4
        with:
          repository: en-wl/wordlist
          ref: 1e5b7d3a72f47a71da5d28686c1dd4b397178485
          path: official-esdb
          persist-credentials: false
      - name: Generate pinned attributed offline dictionary, without Internet permission
        shell: bash
        run: |
          set -euo pipefail
          test -s official-esdb/Copyright
          test -s app/src/main/assets/dictionaries/ESDB_COPYRIGHT.txt
          make -C official-esdb
          (cd official-esdb && ./scowl word-list 60 A 1 --categories=) > "$RUNNER_TEMP/esdb-en.txt"
          printf '%s  %s\n' a5d2f75b95d3530485e539352dc01f9dd9079e03fdaca37466292bf1a360c600 "$RUNNER_TEMP/esdb-en.txt" | sha256sum --check
          mkdir -p app/src/main/assets/dictionaries
          gzip -n -9 < "$RUNNER_TEMP/esdb-en.txt" > app/src/main/assets/dictionaries/esdb-en-US-60.esdbpack
          gzip -t app/src/main/assets/dictionaries/esdb-en-US-60.esdbpack
      - name: Assemble debug APK and verify separate identity before emulator
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace :app:assembleDebug
          apk=$(find app/build/outputs/apk/debug -maxdepth 1 -name '*.apk' -type f -print -quit)
          test -s "$apk"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk" | head -n 1 |
            grep -Fq "package: name='com.chroomareborn.keyboard.build333trial' versionCode='333'"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" list "$apk" | grep -Fxq 'assets/dictionaries/esdb-en-US-60.esdbpack'
          ! "$ANDROID_HOME/build-tools/35.0.0/aapt" dump permissions "$apk" |
            grep -F 'android.permission.INTERNET'
      - name: Enable KVM on runner
        run: |
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: >-
            gradle --no-daemon --stacktrace :app:connectedDebugAndroidTest :app:assembleDebug > candidate333-android35.log 2>&1;
            code=$?;
            cat candidate333-android35.log;
            test "$code" -eq 0 &&
            grep -E "Finished ([4-9][0-9]|[1-9][0-9][0-9]+) tests" candidate333-android35.log &&
            grep -F "BUILD SUCCESSFUL" candidate333-android35.log &&
            ! grep -E "([1-9][0-9]* failure\\(s\\)|[[:space:]]FAILED[[:space:]]|Tests on .* failed)" candidate333-android35.log
      - name: Verify signer, assets, package, permissions and SHA256
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          apk=$(find app/build/outputs/apk/debug -maxdepth 1 -name '*.apk' -type f -print -quit)
          test -s "$apk"
          cp "$apk" dist/Orivra-Candidate-333.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk" | head -n 1 | tee dist/package.txt
          grep -Fq "package: name='com.chroomareborn.keyboard.build333trial' versionCode='333'" dist/package.txt
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$apk" | tee dist/signature.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump permissions "$apk" | tee dist/permissions.txt
          ! grep -Fq 'android.permission.INTERNET' dist/permissions.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" list "$apk" | grep -Fxq 'assets/dictionaries/esdb-en-US-60.esdbpack'
          "$ANDROID_HOME/build-tools/35.0.0/aapt" list "$apk" | grep -Fxq 'assets/dictionaries/ESDB_COPYRIGHT.txt'
          (cd dist && sha256sum Orivra-Candidate-333.apk > Orivra-Candidate-333.apk.sha256)
      - name: Keep verified candidate trial and integrity report
        uses: actions/upload-artifact@v4
        with:
          name: Orivra-Candidate-333-Android35-Passed
          path: dist/
          retention-days: 30
          if-no-files-found: error
