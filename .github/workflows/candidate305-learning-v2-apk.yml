name: Orivra Candidate 305 - Learning V2 Contractions and Android prerelease
on:
  push:
    branches:
      - candidate/build305-learning-v2-contractions-trial-20261029
    paths:
      - .github/workflows/candidate305-learning-v2-apk.yml
      - app/build.gradle.kts
      - app/src/main/java/com/chroomareborn/keyboard/MainActivity.java
      - app/src/main/java/com/chroomareborn/keyboard/CandidateLatencyMetrics.java
      - app/src/main/java/com/chroomareborn/keyboard/EnglishApostrophePolicy.java
      - app/src/main/java/com/chroomareborn/keyboard/LearningV2Policy.java
      - app/src/main/java/com/chroomareborn/keyboard/PersonalLearning.java
      - app/src/main/java/com/chroomareborn/keyboard/PersonalDictionaryPolicy.java
      - app/src/main/java/com/chroomareborn/keyboard/PersonalDictionary.java
      - app/src/main/java/com/chroomareborn/keyboard/CursorWordCorrectionPolicy.java
      - app/src/main/java/com/chroomareborn/keyboard/RebornImeService.java
      - app/src/main/java/com/chroomareborn/keyboard/MainActivity.java
      - app/src/testsupport/java/com/chroomareborn/keyboard/EnglishApostropheAndLearningV2Test.java
      - app/src/androidTest/java/com/chroomareborn/keyboard/PersonalLearningV2AndroidTest.java
      - app/src/androidTest/java/com/chroomareborn/keyboard/ApostropheComposingAndroidTest.java
      - app/src/main/java/com/chroomareborn/keyboard/SuggestionStripLayoutPolicy.java
      - app/src/testsupport/java/com/chroomareborn/keyboard/SuggestionStripLayoutPolicyTest.java
      - app/src/androidTest/java/com/chroomareborn/keyboard/IdleSuggestionCenterAndroidTest.java
      - app/src/main/java/com/chroomareborn/keyboard/ExactOnlyLanguagePack.java
      - app/src/main/java/com/chroomareborn/keyboard/CompressedLanguagePack.java
      - app/src/main/java/com/chroomareborn/keyboard/OfflineDictionaryActivationPolicy.java
      - app/src/testsupport/java/com/chroomareborn/keyboard/OfflineDictionaryActivationPolicyTest.java
      - app/src/androidTest/java/com/chroomareborn/keyboard/OfflineDictionaryActivationAndroidTest.java
      - app/src/main/java/com/chroomareborn/keyboard/RebornImeService.java
      - app/src/main/java/com/chroomareborn/keyboard/MainActivity.java
      - app/src/main/java/com/chroomareborn/keyboard/OfflineLanguagePackWorker.java
      - app/src/testsupport/java/com/chroomareborn/keyboard/CompressedLanguagePackTest.java
      - app/src/androidTest/java/com/chroomareborn/keyboard/OfflineLanguagePackAndroidTest.java
      - app/src/main/assets/dictionaries/ESDB_COPYRIGHT.txt
      - app/src/main/java/com/chroomareborn/keyboard/ExactOnlySegmentation.java
      - app/src/main/java/com/chroomareborn/keyboard/PredictionLite.java
      - app/src/main/java/com/chroomareborn/keyboard/RebornImeService.java
      - app/src/main/java/com/chroomareborn/keyboard/EditorSuggestionPrivacyPolicy.java
      - app/src/testsupport/java/com/chroomareborn/keyboard/EditorSuggestionPrivacyPolicyTest.java
      - app/src/androidTest/java/com/chroomareborn/keyboard/KeepPredictionSecurityAndroidTest.java
      - app/src/main/java/com/chroomareborn/keyboard/PredictionLite.java
      - app/src/main/java/com/chroomareborn/keyboard/LexiconFamilyExpander.java
      - app/src/main/java/com/chroomareborn/keyboard/SentenceRescue.java
      - app/src/main/java/com/chroomareborn/keyboard/SpanishPredictionLite.java
      - app/src/main/java/com/chroomareborn/keyboard/BilingualPredictionRouter.java
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: orivra-candidate305-learning-v2
  cancel-in-progress: true
jobs:
  java-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Pin qualified 297 language sources without rebuilding unstable experiments
        uses: actions/checkout@v4
        with:
          ref: 0088d96548ad13fcbcfb093016e035e54504eb99
          path: qualified-297
          persist-credentials: false
      - name: Verify no unqualified prediction or UI changes entered Candidate
        shell: bash
        run: |
          set -euo pipefail
          for file in SentenceRescue.java SentenceFlowEvidenceRanker.java LexiconFamilyExpander.java SpanishPredictionLite.java BilingualPredictionRouter.java; do
            cmp "qualified-297/app/src/main/java/com/chroomareborn/keyboard/$file" "app/src/main/java/com/chroomareborn/keyboard/$file"
          done
          cmp qualified-297/app/src/main/AndroidManifest.xml app/src/main/AndroidManifest.xml
          test -s app/src/main/java/com/chroomareborn/keyboard/EditorSuggestionPrivacyPolicy.java
          test -s app/src/testsupport/java/com/chroomareborn/keyboard/EditorSuggestionPrivacyPolicyTest.java
          test -s app/src/androidTest/java/com/chroomareborn/keyboard/KeepPredictionSecurityAndroidTest.java
          test -s app/src/androidTest/java/com/chroomareborn/keyboard/IdleSuggestionCenterAndroidTest.java
          test -s app/src/androidTest/java/com/chroomareborn/keyboard/PersonalLearningV2AndroidTest.java
          test -s app/src/androidTest/java/com/chroomareborn/keyboard/ApostropheComposingAndroidTest.java
          test -s app/src/androidTest/java/com/chroomareborn/keyboard/OfflineLanguagePackAndroidTest.java
          test -s app/src/androidTest/java/com/chroomareborn/keyboard/OfflineDictionaryActivationAndroidTest.java
          grep -Fq 'reconcileOptionalDictionary();' app/src/main/java/com/chroomareborn/keyboard/RebornImeService.java
          test -s app/src/main/assets/dictionaries/ESDB_COPYRIGHT.txt
          # Compressed asset is intentionally generated only in the Android
          # job; the Java source-only job must not require it at checkout.
          ! grep -Fq 'OfflineLanguagePackWorker' app/src/main/java/com/chroomareborn/keyboard/RebornImeService.java
          grep -Fq 'EditorSuggestionPrivacyPolicy.decide(' app/src/main/java/com/chroomareborn/keyboard/RebornImeService.java
          grep -Fq 'EditorInfo.IME_FLAG_NO_PERSONALIZED_LEARNING' app/src/main/java/com/chroomareborn/keyboard/RebornImeService.java
          grep -Fq 'if(editorAllowsPersonalLearning)' app/src/main/java/com/chroomareborn/keyboard/RebornImeService.java
          grep -Fq 'versionCode = 305' app/build.gradle.kts
          grep -Fq 'com.chroomareborn.keyboard.build305trial' app/build.gradle.kts
          grep -Fq 'Orivra Candidate 305' app/build.gradle.kts
          grep -Fq 'Candidate 305' app/src/main/java/com/chroomareborn/keyboard/MainActivity.java
          ! grep -Fq 'Candidate 293' app/src/main/java/com/chroomareborn/keyboard/MainActivity.java
          ! grep -q 'android.permission.INTERNET' app/src/main/AndroidManifest.xml
      - name: Verify phone-confirmed Keep hotfix is strictly unchanged
        uses: actions/checkout@v4
        with:
          ref: 25316b3c429c94b463d0a30db8367789c5ac8792
          path: qualified-candidate-300
          persist-credentials: false
      - name: Require exact editor, privacy and package parity with Candidate 300
        run: |
          set -euo pipefail
          for file in EditorSuggestionPrivacyPolicy.java; do
            cmp "qualified-candidate-300/app/src/main/java/com/chroomareborn/keyboard/$file" "app/src/main/java/com/chroomareborn/keyboard/$file"
          done
          # Candidate 305 is intentionally side-by-side installed.
          # Only app identity/label/version may differ from protected 300.
          python3 - <<'PY'
          from pathlib import Path
          b=Path('qualified-candidate-300/app/build.gradle.kts').read_text()
          b=b.replace('com.chroomareborn.keyboard.build300trial',
                      'com.chroomareborn.keyboard.build305trial')
          b=b.replace('versionCode = 300','versionCode = 305')
          b=b.replace('1.0.21-build300-keep-compatibility',
                      '1.0.24-build305-learning-v2-contractions')
          b=b.replace('Orivra Candidate 300','Orivra Candidate 305')
          assert Path('app/build.gradle.kts').read_text()==b, 'Unexpected Gradle identity difference'
          base=Path('qualified-candidate-300/app/src/main/java/com/chroomareborn/keyboard/CandidateLatencyMetrics.java').read_text()
          adjusted=base.replace('com.chroomareborn.keyboard.build300trial',
                                'com.chroomareborn.keyboard.build305trial')
          actual=Path('app/src/main/java/com/chroomareborn/keyboard/CandidateLatencyMetrics.java').read_text()
          assert actual==adjusted, 'Unexpected candidate metric source change'
          PY
          cmp qualified-candidate-300/app/src/main/AndroidManifest.xml app/src/main/AndroidManifest.xml
          grep -Fq 'EditorSuggestionPrivacyPolicy.Decision privacy=editorPrivacyDecision(info);' app/src/main/java/com/chroomareborn/keyboard/RebornImeService.java
          grep -Fq 'sensitive=privacy.sensitive;' app/src/main/java/com/chroomareborn/keyboard/RebornImeService.java
          grep -Fq 'editorAllowsPersonalLearning=privacy.allowPersonalLearning;' app/src/main/java/com/chroomareborn/keyboard/RebornImeService.java
          grep -Fq 'reconcileOptionalDictionary();' app/src/main/java/com/chroomareborn/keyboard/RebornImeService.java
          grep -Fq 'closeOptionalDictionary();' app/src/main/java/com/chroomareborn/keyboard/RebornImeService.java
          grep -Fq 'private boolean optionalDictionaryEnabled()' app/src/main/java/com/chroomareborn/keyboard/RebornImeService.java
          grep -Fq 'getBoolean(OfflineDictionaryActivationPolicy.KEY,false)' app/src/main/java/com/chroomareborn/keyboard/RebornImeService.java
          test -s app/src/main/java/com/chroomareborn/keyboard/OfflineDictionaryActivationPolicy.java
          test -s app/src/testsupport/java/com/chroomareborn/keyboard/OfflineDictionaryActivationPolicyTest.java
          test -s app/src/androidTest/java/com/chroomareborn/keyboard/OfflineDictionaryActivationAndroidTest.java
          test -s app/src/main/java/com/chroomareborn/keyboard/ExactOnlyLanguagePack.java
          test -s app/src/main/java/com/chroomareborn/keyboard/ExactOnlySegmentation.java
      - name: Pin accepted Candidate 305 source
        uses: actions/checkout@v4
        with:
          ref: 09dd61cb48fe9bb22ef51b678dd8119203745046
          path: qualified-candidate-304
          persist-credentials: false
      - name: Require unchanged predictor, privacy policy, controls and app package
        run: |
          set -euo pipefail
          for file in PredictionLite.java ExactOnlyLanguagePack.java CompressedLanguagePack.java OfflineLanguagePackWorker.java OfflineDictionaryActivationPolicy.java EditorSuggestionPrivacyPolicy.java SentenceRescue.java SentenceFlowEvidenceRanker.java SuggestionStripLayoutPolicy.java NextWordCandidatePolicy.java; do
            cmp "qualified-candidate-304/app/src/main/java/com/chroomareborn/keyboard/$file" "app/src/main/java/com/chroomareborn/keyboard/$file"
          done
          python3 - <<'PY'
          from pathlib import Path
          old=Path('qualified-candidate-304/app/build.gradle.kts').read_text()
          old=old.replace('com.chroomareborn.keyboard.build304trial',
                          'com.chroomareborn.keyboard.build305trial')
          old=old.replace('versionCode = 304','versionCode = 305')
          old=old.replace('1.0.23-build304-idle-predictions-centered',
                          '1.0.24-build305-learning-v2-contractions')
          old=old.replace('Orivra Candidate 304','Orivra Candidate 305')
          assert old==Path('app/build.gradle.kts').read_text(), 'Unexpected build metadata drift'
          PY
          cmp qualified-candidate-304/app/src/main/AndroidManifest.xml app/src/main/AndroidManifest.xml
          grep -Fq 'if(editorAllowsPersonalLearning)' app/src/main/java/com/chroomareborn/keyboard/RebornImeService.java
          grep -Fq 'PersonalLearning.recordAcceptance(this,expected,suggestion);' app/src/main/java/com/chroomareborn/keyboard/RebornImeService.java
          grep -Fq 'editorAllowsPersonalLearning=privacy.allowPersonalLearning;' app/src/main/java/com/chroomareborn/keyboard/RebornImeService.java
          grep -Fq 'centerIdleSuggestions(' app/src/main/java/com/chroomareborn/keyboard/RebornImeService.java
          grep -Fq 'EnglishApostrophePolicy.canAppendApostrophe(composing,value)' app/src/main/java/com/chroomareborn/keyboard/RebornImeService.java
          grep -Fq 'LearningV2Policy.extract(typed,accepted)' app/src/main/java/com/chroomareborn/keyboard/PersonalLearning.java
          grep -Fq 'orivra_personal_learning_v1' app/src/main/java/com/chroomareborn/keyboard/PersonalLearning.java
      - name: Validate isolation, safe Enter and privacy
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'com.chroomareborn.keyboard.build305trial' app/build.gradle.kts
          grep -Fq 'EnterKeyPolicy.supportsNewline(info.inputType)' app/src/main/java/com/chroomareborn/keyboard/RebornImeService.java
          grep -Fq 'EnterKeyPolicy.shouldSendOnRelease(' app/src/main/java/com/chroomareborn/keyboard/RebornImeService.java
          grep -Fq 'BackspaceSwipeEditorTransaction.apply(' app/src/main/java/com/chroomareborn/keyboard/RebornImeService.java
          grep -Fq 'BackspaceRepeatGuard.repeatAllowed(' app/src/main/java/com/chroomareborn/keyboard/RebornImeService.java
          grep -Fq 'ThemeStatusLabel.compact(' app/src/main/java/com/chroomareborn/keyboard/RebornImeService.java
          grep -Fq 'enterTouchActive' app/src/main/java/com/chroomareborn/keyboard/RebornImeService.java
          grep -Fq 'event.getRawX()-startX[0]' app/src/main/java/com/chroomareborn/keyboard/RebornImeService.java
          grep -Fq 'paletteButton.setText("🎨")' app/src/main/java/com/chroomareborn/keyboard/RebornImeService.java
          grep -Fq 'ThemePanelLayout.apply(themePanel,toolbarExpanded)' app/src/main/java/com/chroomareborn/keyboard/RebornImeService.java
          grep -Fq 'base.addView(themePanel' app/src/main/java/com/chroomareborn/keyboard/RebornImeService.java
          grep -Fq 'paletteControls.addView(paletteButton' app/src/main/java/com/chroomareborn/keyboard/RebornImeService.java
          if grep -Fq 'themeExpanderButton' app/src/main/java/com/chroomareborn/keyboard/RebornImeService.java; then
            echo "Redundant theme icon must not occupy prediction strip"
            exit 1
          fi
          grep -Fq 'predictionHeader.addView(suggestionScroll,stripParams)' app/src/main/java/com/chroomareborn/keyboard/RebornImeService.java
          grep -Fq 'if(toolbarExpanded)' app/src/main/java/com/chroomareborn/keyboard/RebornImeService.java
          grep -Fq 'SuggestionVisualStyle.chipColor(' app/src/main/java/com/chroomareborn/keyboard/RebornImeService.java
          grep -Fq 'SuggestionVisualStyle.readableText(' app/src/main/java/com/chroomareborn/keyboard/RebornImeService.java
          grep -Fq 'int black=0xff000000;' app/src/main/java/com/chroomareborn/keyboard/SuggestionVisualStyle.java
          grep -Fq 'TypingMotionPolicy.scale(' app/src/main/java/com/chroomareborn/keyboard/RebornImeService.java
          grep -Fq 'SentenceFlowEvidenceRanker.rerank(' app/src/main/java/com/chroomareborn/keyboard/PredictionLite.java
          test -s app/src/main/java/com/chroomareborn/keyboard/SpanishPredictionLite.java
          test -s app/src/main/java/com/chroomareborn/keyboard/BilingualPredictionRouter.java
          if grep -q 'BilingualPredictionRouter' app/src/main/java/com/chroomareborn/keyboard/RebornImeService.java; then
            echo 'Research Spanish must not be enabled before explicit language selection'
            exit 1
          fi
          if grep -Fq 'toolbarToggle' app/src/main/java/com/chroomareborn/keyboard/RebornImeService.java; then
            echo 'Second collapse arrow must be removed'
            exit 1
          fi
          if grep -Fq 'base.addView(paletteBar' app/src/main/java/com/chroomareborn/keyboard/RebornImeService.java; then
            echo "Old permanent theme row must not return"
            exit 1
          fi
          grep -Fq 'ThemePanelLayout.apply(themePanel,false)' app/src/main/java/com/chroomareborn/keyboard/RebornImeService.java
          if grep -Fq 'android.permission.INTERNET' app/src/main/AndroidManifest.xml; then exit 1; fi
          if git ls-files | grep -Ei '(^research/|^evaluation/|^app/src/debug/|\.(jks|keystore|p12|pem|pfx|key)$)'; then exit 1; fi
      - name: Run 19 Java suites including seeded suggestion color contrast, Safe Enter and typing motion
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/orivra-classes"
          javac -d "$RUNNER_TEMP/orivra-classes" \
            app/src/main/java/com/chroomareborn/keyboard/EnglishApostrophePolicy.java \
            app/src/main/java/com/chroomareborn/keyboard/KeyboardLayoutSpec.java \
            app/src/main/java/com/chroomareborn/keyboard/KeyboardHapticStyle.java \
            app/src/main/java/com/chroomareborn/keyboard/EnterKeyPolicy.java \
            app/src/main/java/com/chroomareborn/keyboard/BackspaceSwipePolicy.java \
            app/src/main/java/com/chroomareborn/keyboard/BackspaceSwipeSnapshotGuard.java \
            app/src/main/java/com/chroomareborn/keyboard/BackspaceSwipeEditorTransaction.java \
            app/src/main/java/com/chroomareborn/keyboard/BackspaceRepeatGuard.java \
            app/src/main/java/com/chroomareborn/keyboard/ThemeStatusLabel.java \
            app/src/main/java/com/chroomareborn/keyboard/SuggestionVisualStyle.java \
            app/src/main/java/com/chroomareborn/keyboard/TypingMotionPolicy.java \
            app/src/main/java/com/chroomareborn/keyboard/SuggestionStripLayoutPolicy.java \
            app/src/main/java/com/chroomareborn/keyboard/PunctuationSpacing.java \
            app/src/main/java/com/chroomareborn/keyboard/CursorWordCorrectionPolicy.java \
            app/src/main/java/com/chroomareborn/keyboard/SpacebarCursorGesture.java \
            app/src/main/java/com/chroomareborn/keyboard/CursorSwipeBatch.java \
            app/src/main/java/com/chroomareborn/keyboard/CursorMovementPolicy.java \
            app/src/main/java/com/chroomareborn/keyboard/CursorReleaseSuggestionPolicy.java \
            app/src/main/java/com/chroomareborn/keyboard/CursorFallbackBoundaryPolicy.java \
            app/src/testsupport/java/com/chroomareborn/keyboard/KeyboardLayoutSpecTest.java \
            app/src/testsupport/java/com/chroomareborn/keyboard/KeyboardHapticStyleTest.java \
            app/src/testsupport/java/com/chroomareborn/keyboard/EnterKeyPolicyTest.java \
            app/src/testsupport/java/com/chroomareborn/keyboard/BackspaceSwipePolicyTest.java \
            app/src/testsupport/java/com/chroomareborn/keyboard/BackspaceSwipeSnapshotGuardTest.java \
            app/src/testsupport/java/com/chroomareborn/keyboard/BackspaceSwipeEditorTransactionTest.java \
            app/src/testsupport/java/com/chroomareborn/keyboard/BackspaceRepeatGuardTest.java \
            app/src/testsupport/java/com/chroomareborn/keyboard/ThemeStatusLabelTest.java \
            app/src/testsupport/java/com/chroomareborn/keyboard/SuggestionVisualStyleTest.java \
            app/src/testsupport/java/com/chroomareborn/keyboard/TypingMotionPolicyTest.java \
            app/src/testsupport/java/com/chroomareborn/keyboard/EnterReleaseBoundaryTest.java \
            app/src/testsupport/java/com/chroomareborn/keyboard/SuggestionStripLayoutPolicyTest.java \
            app/src/testsupport/java/com/chroomareborn/keyboard/PunctuationSpacingTest.java \
            app/src/testsupport/java/com/chroomareborn/keyboard/CursorWordCorrectionPolicyTest.java \
            app/src/testsupport/java/com/chroomareborn/keyboard/SpacebarCursorGestureTest.java \
            app/src/testsupport/java/com/chroomareborn/keyboard/CursorSwipeBatchTest.java \
            app/src/testsupport/java/com/chroomareborn/keyboard/CursorReleaseSuggestionPolicyTest.java \
            app/src/testsupport/java/com/chroomareborn/keyboard/CursorFallbackBoundaryPolicyTest.java
          for suite in EnterKeyPolicyTest BackspaceSwipePolicyTest BackspaceSwipeSnapshotGuardTest BackspaceSwipeEditorTransactionTest BackspaceRepeatGuardTest ThemeStatusLabelTest SuggestionVisualStyleTest TypingMotionPolicyTest EnterReleaseBoundaryTest KeyboardLayoutSpecTest KeyboardHapticStyleTest SuggestionStripLayoutPolicyTest PunctuationSpacingTest CursorWordCorrectionPolicyTest SpacebarCursorGestureTest CursorSwipeBatchTest CursorReleaseSuggestionPolicyTest CursorFallbackBoundaryPolicyTest; do
            java -ea -cp "$RUNNER_TEMP/orivra-classes" "com.chroomareborn.keyboard.$suite"
          done
      - name: Test 300 Keep exception and password/learning privacy matrix
        shell: bash
        run: |
          set -euo pipefail
          javac -encoding UTF-8 -d "$RUNNER_TEMP/orivra-classes" \
            app/src/main/java/com/chroomareborn/keyboard/EditorSuggestionPrivacyPolicy.java \
            app/src/testsupport/java/com/chroomareborn/keyboard/EditorSuggestionPrivacyPolicyTest.java
          java -ea -cp "$RUNNER_TEMP/orivra-classes" \
            com.chroomareborn.keyboard.EditorSuggestionPrivacyPolicyTest
      - name: Test pure-Java exact-word segmentation guard
        run: |
          javac -encoding UTF-8 -d "$RUNNER_TEMP/orivra-classes" \
            app/src/main/java/com/chroomareborn/keyboard/ExactOnlyLanguagePack.java \
            app/src/main/java/com/chroomareborn/keyboard/ExactOnlySegmentation.java \
            app/src/testsupport/java/com/chroomareborn/keyboard/ExactOnlySegmentationTest.java
          java -ea -cp "$RUNNER_TEMP/orivra-classes" \
            com.chroomareborn.keyboard.ExactOnlySegmentationTest
      - name: Test bounded integrity-verified compressed dictionary fallback
        run: |
          set -euo pipefail
          javac -encoding UTF-8 -d "$RUNNER_TEMP/orivra-classes" \
            app/src/main/java/com/chroomareborn/keyboard/ExactOnlyLanguagePack.java \
            app/src/main/java/com/chroomareborn/keyboard/CompressedLanguagePack.java \
            app/src/testsupport/java/com/chroomareborn/keyboard/CompressedLanguagePackTest.java
          java -Xmx128m -ea -cp "$RUNNER_TEMP/orivra-classes" \
            com.chroomareborn.keyboard.CompressedLanguagePackTest
      - name: Test default-OFF, protected-field and stale-callback activation gates
        run: |
          set -euo pipefail
          javac -encoding UTF-8 -d "$RUNNER_TEMP/orivra-classes" \
            app/src/main/java/com/chroomareborn/keyboard/OfflineDictionaryActivationPolicy.java \
            app/src/testsupport/java/com/chroomareborn/keyboard/OfflineDictionaryActivationPolicyTest.java
          java -ea -cp "$RUNNER_TEMP/orivra-classes" \
            com.chroomareborn.keyboard.OfflineDictionaryActivationPolicyTest
      - name: Verify Learning V2 apostrophe policy and explicit one-word extraction
        run: |
          set -euo pipefail
          javac -encoding UTF-8 -d "$RUNNER_TEMP/orivra-classes" \
            app/src/main/java/com/chroomareborn/keyboard/EnglishApostrophePolicy.java \
            app/src/main/java/com/chroomareborn/keyboard/LearningV2Policy.java \
            app/src/main/java/com/chroomareborn/keyboard/PersonalDictionaryPolicy.java \
            app/src/main/java/com/chroomareborn/keyboard/CursorWordCorrectionPolicy.java \
            app/src/testsupport/java/com/chroomareborn/keyboard/EnglishApostropheAndLearningV2Test.java
          java -ea -cp "$RUNNER_TEMP/orivra-classes" \
            com.chroomareborn.keyboard.EnglishApostropheAndLearningV2Test
      - name: Scope of pure Java checks
        run: echo "Pure Java checks passed, native Android emulator and isolated APK checks follow."
  panel-emulator:
    needs: java-regressions
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - uses: actions/checkout@v4
        with:
          repository: en-wl/wordlist
          ref: 1e5b7d3a72f47a71da5d28686c1dd4b397178485
          path: official-esdb
          persist-credentials: false
      - name: Generate reproducible gzip asset with pinned data and attribution
        run: |
          set -euo pipefail
          test -s official-esdb/Copyright
          cmp <(tail -n 1 official-esdb/Copyright) <(tail -n 1 app/src/main/assets/dictionaries/ESDB_COPYRIGHT.txt)
          grep -Fq 'Copyright 2000-2026 by Kevin Atkinson' app/src/main/assets/dictionaries/ESDB_COPYRIGHT.txt
          make -C official-esdb
          (cd official-esdb && ./scowl word-list 60 A 1 --categories=) > "$RUNNER_TEMP/esdb-en-US-60.txt"
