name: Orivra 309 - tap-only contraction candidate and caret QA
on:
  push:
    branches:
      - research/build309-ambiguous-contraction-candidates-20261029
    paths:
      - .github/workflows/research309-ambiguous-contractions-android.yml
      - app/src/main/java/com/chroomareborn/keyboard/EnglishApostrophePolicy.java
      - app/src/main/java/com/chroomareborn/keyboard/CursorEditSnapshotGuard.java
      - app/src/main/java/com/chroomareborn/keyboard/RebornImeService.java
      - app/src/testsupport/java/com/chroomareborn/keyboard/EnglishApostropheAndLearningV2Test.java
      - app/src/testsupport/java/com/chroomareborn/keyboard/CursorEditSnapshotGuardTest.java
      - app/src/testsupport/java/com/chroomareborn/keyboard/ContractionTapOnly309Test.java
      - app/src/androidTest/java/com/chroomareborn/keyboard/AmbiguousContractionEditorAndroidTest.java
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: orivra-309-tap-only-research
  cancel-in-progress: true
jobs:
  source-and-java:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: 4d7c6fe346028618546664e840e53be7e0c4139e
          path: qualified-candidate-308
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Guard all stable source except approved contraction and caret changes
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          base=Path('qualified-candidate-308/app')
          now=Path('app')
          allowed={
            'src/main/java/com/chroomareborn/keyboard/EnglishApostrophePolicy.java',
            'src/main/java/com/chroomareborn/keyboard/CursorEditSnapshotGuard.java',
            'src/main/java/com/chroomareborn/keyboard/RebornImeService.java',
            'src/testsupport/java/com/chroomareborn/keyboard/EnglishApostropheAndLearningV2Test.java',
            'src/testsupport/java/com/chroomareborn/keyboard/CursorEditSnapshotGuardTest.java',
          }
          for tree in ('src/main/java','src/testsupport','src/androidTest'):
              for p in (base/tree).rglob('*.java'):
                  rel=p.relative_to(base).as_posix()
                  if rel not in allowed:
                      assert p.read_bytes()==(now/rel).read_bytes(),f'Unapproved regression drift: {rel}'
          assert (base/'build.gradle.kts').read_bytes()==(now/'build.gradle.kts').read_bytes(),'App package drift'
          assert (base/'src/main/AndroidManifest.xml').read_bytes()==(now/'src/main/AndroidManifest.xml').read_bytes(),'Manifest drift'
          a=(base/'src/main/java/com/chroomareborn/keyboard/RebornImeService.java').read_text()
          b=(now/'src/main/java/com/chroomareborn/keyboard/RebornImeService.java').read_text()
          # Verify existing privacy, editor policy, cursor ticket and asynchronous
          # prediction infrastructure have not been deleted.
          for token in ('EnglishApostrophePolicy.hasDistinctSuggestion(snapshot)',
                        'visibleEditingTicket=editTicket',
                        'CursorWordCorrectionPolicy.safeOptions(',
                        'predictionDispatcher.schedule(snapshot',
                        'if(sensitive) {',
                        'editorAllowsPersonalLearning'):
              assert token in b, f'Missing new or protected safety boundary: {token}'
          assert len(b)-len(a)<4000, 'IME change exceeded narrow scope'
          print('PASS: protected Candidate 308 source retained')
          PY
          ! grep -Fq 'android.permission.INTERNET' app/src/main/AndroidManifest.xml
          test -s app/src/testsupport/java/com/chroomareborn/keyboard/ContractionTapOnly309Test.java
          test -s app/src/androidTest/java/com/chroomareborn/keyboard/AmbiguousContractionEditorAndroidTest.java
      - name: Compile and run frozen plus new contraction/caret safety regressions
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/classes"
          javac -encoding UTF-8 -d "$RUNNER_TEMP/classes" \
            app/src/main/java/com/chroomareborn/keyboard/EnglishApostrophePolicy.java \
            app/src/main/java/com/chroomareborn/keyboard/LearningV2Policy.java \
            app/src/main/java/com/chroomareborn/keyboard/PersonalDictionaryPolicy.java \
            app/src/main/java/com/chroomareborn/keyboard/CursorWordCorrectionPolicy.java \
            app/src/main/java/com/chroomareborn/keyboard/CursorEditSnapshotGuard.java \
            app/src/testsupport/java/com/chroomareborn/keyboard/EnglishApostropheAndLearningV2Test.java \
            app/src/testsupport/java/com/chroomareborn/keyboard/CursorEditSnapshotGuardTest.java \
            app/src/testsupport/java/com/chroomareborn/keyboard/ContractionTapOnly309Test.java
          java -ea -Xmx128m -cp "$RUNNER_TEMP/classes" \
            com.chroomareborn.keyboard.EnglishApostropheAndLearningV2Test
          java -ea -Xmx128m -cp "$RUNNER_TEMP/classes" \
            com.chroomareborn.keyboard.CursorEditSnapshotGuardTest
          java -ea -Xmx128m -cp "$RUNNER_TEMP/classes" \
            com.chroomareborn.keyboard.ContractionTapOnly309Test
  android-35-emulator:
    needs: source-and-java
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - uses: actions/checkout@v4
        with:
          repository: en-wl/wordlist
          ref: 1e5b7d3a72f47a71da5d28686c1dd4b397178485
          path: official-esdb
          persist-credentials: false
      - name: Build pinned licensed English dictionary for inherited tests
        run: |
          set -euo pipefail
          test -s official-esdb/Copyright
          test -s app/src/main/assets/dictionaries/ESDB_COPYRIGHT.txt
          make -C official-esdb
          (cd official-esdb && ./scowl word-list 60 A 1 --categories=) > "$RUNNER_TEMP/esdb-en.txt"
          printf '%s  %s\n' a5d2f75b95d3530485e539352dc01f9dd9079e03fdaca37466292bf1a360c600 "$RUNNER_TEMP/esdb-en.txt" | sha256sum --check
          mkdir -p app/src/main/assets/dictionaries
          gzip -n -9 < "$RUNNER_TEMP/esdb-en.txt" > app/src/main/assets/dictionaries/esdb-en-US-60.esdbpack
          gzip -t < app/src/main/assets/dictionaries/esdb-en-US-60.esdbpack
      - name: Inspect protected Android test package and new source
        run: |
          set -euo pipefail
          grep -Fq 'com.chroomareborn.keyboard.build308trial' app/build.gradle.kts
          test -s app/src/androidTest/java/com/chroomareborn/keyboard/AmbiguousContractionEditorAndroidTest.java
          test -s app/src/androidTest/java/com/chroomareborn/keyboard/LearningTransferStoreAndroidTest.java
          test -s app/src/androidTest/java/com/chroomareborn/keyboard/KeepPredictionSecurityAndroidTest.java
          ! grep -Fq 'android.permission.INTERNET' app/src/main/AndroidManifest.xml
      - name: Enable KVM
        run: |
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            set -euo pipefail
            gradle --no-daemon --stacktrace :app:connectedDebugAndroidTest :app:assembleDebug 2>&1 | tee build309-android35.log
            grep -F 'Finished 38 tests' build309-android35.log
      - name: Research result only, no user APK release
        run: echo "38 Android emulator tests passed; no phone release or personal data collection."
