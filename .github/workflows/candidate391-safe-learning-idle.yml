name: Orivra Candidate 391 - safe V4 migration and next-word swipes
on:
  push:
    branches:
      - candidate/build391-safe-learning-idle-20261031
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: orivra-candidate391
  cancel-in-progress: true
jobs:
  source-and-gestures:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Confirm candidate identity only - all production migration code identical to Research 391
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          base='35e9eb02f8db7d527f53881d9a05e0c72d4b5405'
          changed=set(subprocess.check_output(['git','diff','--name-only',base,'HEAD'],text=True).splitlines())
          allowed={
              'app/build.gradle.kts',
              'app/src/main/java/com/chroomareborn/keyboard/MainActivity.java',
              'app/src/main/java/com/chroomareborn/keyboard/CandidateLatencyMetrics.java',
              'app/src/androidTest/java/com/chroomareborn/keyboard/OfflineLanguagePackAndroidTest.java',
              'docs/CANDIDATE391_SAFE_LEARNING_IDLE_20261031.md',
              '.github/workflows/candidate391-safe-learning-idle.yml',
          }
          assert changed==allowed,(changed^allowed)
          old=lambda p:subprocess.check_output(['git','show',base+':'+p],text=True)
          unchanged=[
              'RebornImeService.java','LetterRowPredictionSwipe386.java',
              'LetterRowIdleMode388.java','PredictionSwipe372.java',
              'HighlightedSpace372.java','SentenceSuggestionCommit.java',
              'HintKeyPressOrder353.java','ThumbTapGuard377.java',
              'LearningCapacity390.java','LearningTransferCodec.java',
              'PersonalLearning.java','ContextBackupFormat322.java',
              'PersonalContextLearning319.java','FrequencyBackupFormat330.java',
              'PersonalWordFrequency328.java','TypedLearningV4Transfer347.java',
              'TypedLearningV4Codec341.java','TypedWordEvidenceStore341.java',
          ]
          root=Path('app/src/main/java/com/chroomareborn/keyboard')
          for name in unchanged:
              path=str(root/name)
              assert Path(path).read_text()==old(path),path
          for name in [
              'LearningCapacity390AndroidTest.java',
              'LetterRowIdle388AndroidTest.java',
              'LetterRowPredictionSwipe386AndroidTest.java',
          ]:
              path='app/src/androidTest/java/com/chroomareborn/keyboard/'+name
              assert Path(path).read_text()==old(path),path
          build=Path('app/build.gradle.kts').read_text()
          assert 'applicationId = "com.chroomareborn.keyboard.build391trial"' in build
          assert 'versionCode = 391' in build
          assert '"Orivra Candidate 391"' in build
          main=Path('app/src/main/java/com/chroomareborn/keyboard/MainActivity.java').read_text()
          assert 'Orivra — Candidate 391 Test' in main
          assert 'SAFE 378 + 386 LEARNING MIGRATION' in main
          assert 'TypedLearningV4Transfer347.importConfirmed(' in main
          assert 'TypedLearningV4Transfer347.exportV4(this)' in main
          assert 'LetterRowPredictionSwipe386.PREF,0' in main
          for path in [
              'app/src/main/java/com/chroomareborn/keyboard/CandidateLatencyMetrics.java',
              'app/src/androidTest/java/com/chroomareborn/keyboard/OfflineLanguagePackAndroidTest.java'
          ]:assert 'com.chroomareborn.keyboard.build391trial' in Path(path).read_text()
          caps=(root/'LearningCapacity390.java').read_text()
          for s in ['MAX_CORRECTIONS=384','MAX_CONTEXT_KEYS=320','MAX_FREQUENCIES=400']:
              assert s in caps,s
          ime=(root/'RebornImeService.java').read_text()
          assert 'LetterRowIdleMode388.start(' in ime
          assert 'LetterRowIdleMode388.finish(' in ime
          assert 'acceptSuggestion(key,expected386,selectedRow386)' in ime
          manifest=Path('app/src/main/AndroidManifest.xml').read_text()
          assert 'android:allowBackup="false"' in manifest
          assert 'android:usesCleartextTraffic="false"' in manifest
          assert 'android.permission.INTERNET' not in manifest
          print('PASS: independent 391 APK identity, 378/386 intact, full migration and gesture source preserved')
          PY
      - name: Replay 130k letter-row gestures and tiny-word Space policies
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/row386"
          javac -encoding UTF-8 -d "$RUNNER_TEMP/row386" \
            app/src/main/java/com/chroomareborn/keyboard/LetterRowPredictionSwipe386.java \
            app/src/main/java/com/chroomareborn/keyboard/PredictionSwipe372.java \
            app/src/main/java/com/chroomareborn/keyboard/SuggestionContinuity353.java \
            app/src/main/java/com/chroomareborn/keyboard/SentenceSuggestionCommit.java \
            app/src/main/java/com/chroomareborn/keyboard/HighlightedSpace372.java \
            app/src/testsupport/java/com/chroomareborn/keyboard/LetterRowPredictionSwipe386Research.java
          java -cp "$RUNNER_TEMP/row386" \
            com.chroomareborn.keyboard.LetterRowPredictionSwipe386Research
      - name: Replay 80000 next-word idle gesture and stale-caret checks
        shell: bash
        run: |
          set -euo pipefail
          javac -encoding UTF-8 -cp "$RUNNER_TEMP/row386" \
            -d "$RUNNER_TEMP/row386" \
            app/src/main/java/com/chroomareborn/keyboard/LetterRowIdleMode388.java \
            app/src/testsupport/java/com/chroomareborn/keyboard/LetterRowIdleMode388Research.java
          java -cp "$RUNNER_TEMP/row386" \
            com.chroomareborn.keyboard.LetterRowIdleMode388Research
      - name: Replay 200000 learning-capacity combinations
        shell: bash
        run: |
          set -euo pipefail
          javac -encoding UTF-8 -d "$RUNNER_TEMP/row386" \
            app/src/main/java/com/chroomareborn/keyboard/LearningCapacity390.java \
            app/src/testsupport/java/com/chroomareborn/keyboard/LearningCapacity390Research.java
          java -cp "$RUNNER_TEMP/row386" \
            com.chroomareborn.keyboard.LearningCapacity390Research

  android35-qualify-and-release:
    needs: source-and-gestures
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - uses: actions/checkout@v4
        with:
          repository: en-wl/wordlist
          ref: 1e5b7d3a72f47a71da5d28686c1dd4b397178485
          path: official-esdb
          persist-credentials: false
      - name: Restore pinned offline English dictionary
        shell: bash
        run: |
          set -euo pipefail
          test -s official-esdb/Copyright
          test -s app/src/main/assets/dictionaries/ESDB_COPYRIGHT.txt
          make -C official-esdb
          (cd official-esdb && ./scowl word-list 60 A 1 --categories=) > "$RUNNER_TEMP/esdb-en.txt"
          printf '%s  %s\n' a5d2f75b95d3530485e539352dc01f9dd9079e03fdaca37466292bf1a360c600 "$RUNNER_TEMP/esdb-en.txt" | sha256sum --check
          mkdir -p app/src/main/assets/dictionaries
          gzip -n -9 < "$RUNNER_TEMP/esdb-en.txt" > app/src/main/assets/dictionaries/esdb-en-US-60.esdbpack
      - name: Compile signed Candidate 391 and full 261-test instrumentation
        run: gradle --no-daemon --stacktrace :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Enable emulator acceleration
        run: |
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: gradle --no-daemon --stacktrace :app:connectedDebugAndroidTest
      - name: Verify full emulator suite, signature, package, permissions and dictionary
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree as ET
          reports=list(Path('app/build/outputs/androidTest-results/connected').rglob('*.xml'))
          assert reports,'Missing emulator test reports'
          tests=failures=errors=skips=0
          for file in reports:
              root=ET.parse(file).getroot()
              suites=[root] if root.tag.endswith('testsuite') else [s for s in root.iter() if s.tag.endswith('testsuite')]
              for suite in suites:
                  tests+=int(suite.attrib.get('tests','0'))
                  failures+=int(suite.attrib.get('failures','0'))
                  errors+=int(suite.attrib.get('errors','0'))
                  skips+=int(suite.attrib.get('skipped','0'))
          print(f'Android 35 emulator: {tests} tests, {failures} failures, {errors} errors, {skips} skipped')
          assert tests>=261 and failures==0 and errors==0 and skips==0
          PY
          mkdir -p dist
          apk=$(find app/build/outputs/apk/debug -maxdepth 1 -name '*.apk' -type f -print -quit)
          test -s "$apk"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk" | head -n1 |
            grep -Fq "package: name='com.chroomareborn.keyboard.build391trial' versionCode='391'"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" list "$apk" |
            grep -Fxq 'assets/dictionaries/esdb-en-US-60.esdbpack'
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$apk" > dist/signature.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump permissions "$apk" > dist/permissions.txt
          ! grep -Fq 'android.permission.INTERNET' dist/permissions.txt
          cp "$apk" dist/Orivra-Candidate-391.apk
          (cd dist && sha256sum Orivra-Candidate-391.apk > Orivra-Candidate-391.apk.sha256)
          cat > dist/Release_Notes.txt <<'TXT'
          Orivra Candidate 391 — Safe V4 Migration and Letter-Row Next-Word Swipes

          Package: com.chroomareborn.keyboard.build391trial
          Independent experimental keyboard, separately installable alongside 378 and 386.

          V4 LEARNING RECOVERY
          - Coordinated caps 384 corrections / 320 contextual keys / 400 frequencies.
          - Full synthetic 378+386 union 304/242/326 passes actual Android import
            both ways, including 58 typed words and 30 typed pairs.
          - Existing key counts merge with MAX, not SUM; no truncation.
          - Keep original 378/386 V4 files and their installed applications.
          - In this NEW empty app import a fresh 386 V4 first, then your intact
            378 V4, approving both preview dialogs. Export a NEW merged V4
            and verify checksum and all six record counts before switching.
          - No automatic data migration and no clearing of older learning.
          - New V4 exports above older caps may not import back to 386.
          - V4 checksum, strict UTF-8 LF and 100KB safety protections remain.

          GESTURES
          - Letter-row LEFT/RIGHT/DOWN options, including idle next-word
            predictions like I | The | Hey and center-only suggestions.
          - Down accepts center and uses exactly one existing Space boundary,
            preserving short-word and punctuation rules.
          - Setting defaults OFF in this separate app; reenable ASDF in Settings.
          - Normal taps, two-thumb protection, private-editor gates and V4
            privacy/consent safeguards preserved.

          Android 35 emulator qualification is NOT Samsung Android 17 phone
          validation. Use a disposable note. No Internet or analytics permission.
          TXT
      - name: Upload qualified APK with SHA-256 audit
        uses: actions/upload-artifact@v4
        with:
          name: Orivra-Candidate391-Android35-Qualified
          path: dist/
          retention-days: 30
          if-no-files-found: error
      - name: Publish prerelease only after full success
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view candidate-391-20261031 >/dev/null 2>&1; then
            echo "Release already exists; refusing overwrite"
            exit 1
          fi
          gh release create candidate-391-20261031 \
            dist/Orivra-Candidate-391.apk \
            dist/Orivra-Candidate-391.apk.sha256 \
            --target "$GITHUB_SHA" \
            --title "Orivra Candidate 391 - Safe V4 Migration and Next-Word Swipes" \
            --notes-file dist/Release_Notes.txt \
            --prerelease
