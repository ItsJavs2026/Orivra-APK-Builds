name: Orivra Research 393 - chat-send recovery + deep long typing (no APK)
on:
  push:
    branches:
      - research/build393-chat-send-reset-and-typing-stress-20261031
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: orivra-research393
  cancel-in-progress: true
jobs:
  source-and-reset-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: No production keyboard release or unsafe writer changes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          base='133d1c2cbe3da72d2b6739ee2b24bcead1f1e78e'
          changed=set(subprocess.check_output(
              ['git','diff','--name-only',base,'HEAD'],text=True).splitlines())
          allowed={
              'app/src/main/java/com/chroomareborn/keyboard/RebornImeService.java',
              'app/src/main/java/com/chroomareborn/keyboard/ChatComposerReset393.java',
              'app/src/androidTest/java/com/chroomareborn/keyboard/ChatComposerStress393AndroidTest.java',
              'app/src/testsupport/java/com/chroomareborn/keyboard/ChatComposerReset393Research.java',
              'docs/RESEARCH393_CHAT_SEND_RESET_TYPING_STRESS_20261031.md',
              '.github/workflows/research393-chat-reset-typing-stress.yml',
          }
          assert changed==allowed,(changed^allowed)
          unchanged=[
              'TypedLearningV4Codec341.java','TypedLearningV4Transfer347.java',
              'LearningTransferStore.java','PersonalLearning.java',
              'PersonalContextLearning319.java','PersonalWordFrequency328.java',
              'LearningCapacity390.java','LetterRowPredictionSwipe386.java',
              'LetterRowIdleMode388.java','PredictionDispatcher.java',
              'CandidateLatencyMetrics.java','NextWordTapTicket340.java',
              'HighlightedSpace372.java','SentenceSuggestionCommit.java',
          ]
          for name in unchanged:
              path='app/src/main/java/com/chroomareborn/keyboard/'+name
              expected=subprocess.check_output(['git','show',base+':'+path],text=True)
              assert Path(path).read_text()==expected,path
          for path in ['app/build.gradle.kts','app/src/main/AndroidManifest.xml']:
              expected=subprocess.check_output(['git','show',base+':'+path],text=True)
              assert Path(path).read_text()==expected,path
          source=Path('app/src/main/java/com/chroomareborn/keyboard/RebornImeService.java').read_text()
          assert 'ChatComposerReset393.shouldRecover(' in source
          assert 'getTextBeforeCursor(1,0)' in source
          assert 'getTextAfterCursor(1,0)' in source
          helper=Path('app/src/main/java/com/chroomareborn/keyboard/ChatComposerReset393.java').read_text()
          for invalid in ['commitText(', 'setComposingText(', 'deleteSurroundingText(', 'importConfirmed(', 'android.util.Log']:
              assert invalid not in helper,invalid
          assert 'applicationId = "com.chroomareborn.keyboard.build391trial"' in Path('app/build.gradle.kts').read_text()
          assert 'android.permission.INTERNET' not in Path('app/src/main/AndroidManifest.xml').read_text()
          print('PASS: local metadata-only reset, Candidate 391 release/data preserved')
          PY
      - name: Stress 150000 randomized send-reset and editor boundary states
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/r393"
          javac -encoding UTF-8 -d "$RUNNER_TEMP/r393" \
            app/src/main/java/com/chroomareborn/keyboard/ChatComposerReset393.java \
            app/src/testsupport/java/com/chroomareborn/keyboard/ChatComposerReset393Research.java
          java -cp "$RUNNER_TEMP/r393" com.chroomareborn.keyboard.ChatComposerReset393Research
  android35-long-typing:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - uses: actions/checkout@v4
        with:
          repository: en-wl/wordlist
          ref: 1e5b7d3a72f47a71da5d28686c1dd4b397178485
          path: official-esdb
          persist-credentials: false
      - name: Restore pinned offline dictionary
        shell: bash
        run: |
          set -euo pipefail
          test -s official-esdb/Copyright
          test -s app/src/main/assets/dictionaries/ESDB_COPYRIGHT.txt
          make -C official-esdb
          (cd official-esdb && ./scowl word-list 60 A 1 --categories=) > "$RUNNER_TEMP/esdb-en.txt"
          printf '%s  %s\n' a5d2f75b95d3530485e539352dc01f9dd9079e03fdaca37466292bf1a360c600 "$RUNNER_TEMP/esdb-en.txt" | sha256sum --check
          mkdir -p app/src/main/assets/dictionaries
          gzip -n -9 < "$RUNNER_TEMP/esdb-en.txt" > app/src/main/assets/dictionaries/esdb-en-US-60.esdbpack
      - name: Compile full IME and deep typing instrumentation
        run: gradle --no-daemon --stacktrace :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Enable Android emulator acceleration
        run: |
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: gradle --no-daemon --stacktrace :app:connectedDebugAndroidTest
      - name: Require full regression plus 8 deep Android tests
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree as ET
          reports=list(Path('app/build/outputs/androidTest-results/connected').rglob('*.xml'))
          assert reports,'Missing Android test results'
          tests=failures=errors=skips=0
          for f in reports:
              root=ET.parse(f).getroot()
              suites=[root] if root.tag.endswith('testsuite') else [
                  x for x in root.iter() if x.tag.endswith('testsuite')]
              for s in suites:
                  tests+=int(s.attrib.get('tests','0'))
                  failures+=int(s.attrib.get('failures','0'))
                  errors+=int(s.attrib.get('errors','0'))
                  skips+=int(s.attrib.get('skipped','0'))
          print(f'Android 35 emulator: {tests} tests, {failures} failures, {errors} errors, {skips} skipped')
          assert tests>=269 and failures==0 and errors==0 and skips==0
          PY
