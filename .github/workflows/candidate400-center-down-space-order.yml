name: Orivra Candidate 400 - center chip DOWN and physical Space touch ordering
on:
  push:
    branches:
      - candidate/build400-center-down-space-order-20261031
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: orivra-candidate400
  cancel-in-progress: true
jobs:
  source-and-gestures:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify Candidate 400 independence from Research 400
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          base='7247869bbf9ff66364095d78773ef6dc2425f4bd'
          changed=set(subprocess.check_output(['git','diff','--name-only',base,'HEAD'],text=True).splitlines())
          expected={
              'app/build.gradle.kts',
              'app/src/main/java/com/chroomareborn/keyboard/MainActivity.java',
              'app/src/main/java/com/chroomareborn/keyboard/CandidateLatencyMetrics.java',
              'app/src/androidTest/java/com/chroomareborn/keyboard/OfflineLanguagePackAndroidTest.java',
              'docs/CANDIDATE400_CENTER_DOWN_SPACE_ORDER_20261031.md',
              '.github/workflows/candidate400-center-down-space-order.yml',
          }
          assert changed==expected,(changed^expected)
          original=lambda p:subprocess.check_output(['git','show',base+':'+p],text=True)
          root=Path('app/src/main/java/com/chroomareborn/keyboard')
          for name in [
              'RebornImeService.java','AlphabetCaseRelabel398.java',
              'PredictionLite.java','PublicPhraseIndex397.java',
              'PredictionDispatcher.java','LetterRowPredictionSwipe386.java',
              'LetterRowIdleMode388.java','PredictionSwipe372.java',
              'HighlightedSpace372.java','SentenceSuggestionCommit.java',
              'HintKeyPressOrder353.java','ThumbTapGuard377.java',
              'ChatComposerReset393.java','LearningCapacity390.java',
              'PersonalLearning.java','PersonalWordFrequency328.java',
              'PersonalContextLearning319.java','FastStoredLearningPolicy395.java',
              'TypedLearningV4Transfer347.java','TypedLearningV4Codec341.java',
              'TypedWordEvidenceStore341.java','LearningTransferCodec.java',
          ]:
              p=str(root/name)
              assert Path(p).read_text()==original(p),p
          for p in [
              'app/src/main/AndroidManifest.xml',
              'app/src/androidTest/java/com/chroomareborn/keyboard/AlphabetCaseRelabel398AndroidTest.java',
              'app/src/androidTest/java/com/chroomareborn/keyboard/PublicPhraseIndex397AndroidTest.java',
              'app/src/androidTest/java/com/chroomareborn/keyboard/LetterRowDown396AndroidTest.java',
              'app/src/androidTest/java/com/chroomareborn/keyboard/FastStoredLearning395AndroidTest.java',
              'app/src/androidTest/java/com/chroomareborn/keyboard/CenterDownSpaceOrder400AndroidTest.java',
              'app/src/testsupport/java/com/chroomareborn/keyboard/CenterDownSpaceOrder400Research.java'
          ]: assert Path(p).read_text()==original(p),p
          gradle=Path('app/build.gradle.kts').read_text()
          assert 'applicationId = "com.chroomareborn.keyboard.build400trial"' in gradle
          assert 'versionCode = 400' in gradle
          assert '"Orivra Candidate 400"' in gradle
          activity=(root/'MainActivity.java').read_text()
          assert 'Orivra — Candidate 400 Test' in activity
          assert 'SAFE CURRENT CANDIDATE → 400 V4 LEARNING TRANSFER' in activity
          assert 'TypedLearningV4Transfer347.importConfirmed(' in activity
          assert 'TypedLearningV4Transfer347.exportV4(this)' in activity
          for p in [
              str(root/'CandidateLatencyMetrics.java'),
              'app/src/androidTest/java/com/chroomareborn/keyboard/OfflineLanguagePackAndroidTest.java'
          ]:
              assert 'com.chroomareborn.keyboard.build400trial' in Path(p).read_text(),p
              assert 'com.chroomareborn.keyboard.build396trial' not in Path(p).read_text(),p
          ime=(root/'RebornImeService.java').read_text()
          assert 'AlphabetCaseRelabel398.relabel(keys,shift,capsLock)' in ime
          assert 'PublicPhraseIndex397' in (root/'PredictionLite.java').read_text()
          assert 'ChatComposerReset393.shouldRecover(' in ime
          assert 'committedDirection386,now386,chosenIdle388' in ime
          assert 'hintPressOrder353.complete(token400' in ime
          assert 'rowSwipe386[0].earlyDownIntent(' in ime
          assert 'UP, DOWN' in (root/'PredictionSwipe372.java').read_text()
          for marker in ['MAX_CORRECTIONS=384','MAX_CONTEXT_KEYS=320','MAX_FREQUENCIES=400']:
              assert marker in (root/'LearningCapacity390.java').read_text()
          manifest=Path('app/src/main/AndroidManifest.xml').read_text()
          assert 'android:allowBackup="false"' in manifest
          assert 'android:usesCleartextTraffic="false"' in manifest
          assert 'android.permission.INTERNET' not in manifest
          print('PASS: Candidate 400 independence, Research 397+398 and protected learning intact')
          PY
      - name: Replay 130k letter-row gestures and tiny-word Space policies
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/row386"
          javac -encoding UTF-8 -d "$RUNNER_TEMP/row386" \
            app/src/main/java/com/chroomareborn/keyboard/LetterRowPredictionSwipe386.java \
            app/src/main/java/com/chroomareborn/keyboard/PredictionSwipe372.java \
            app/src/main/java/com/chroomareborn/keyboard/SuggestionContinuity353.java \
            app/src/main/java/com/chroomareborn/keyboard/SentenceSuggestionCommit.java \
            app/src/main/java/com/chroomareborn/keyboard/HighlightedSpace372.java \
            app/src/testsupport/java/com/chroomareborn/keyboard/LetterRowPredictionSwipe386Research.java
          java -cp "$RUNNER_TEMP/row386" \
            com.chroomareborn.keyboard.LetterRowPredictionSwipe386Research
      - name: Replay 80000 next-word idle gesture and stale-caret checks
        shell: bash
        run: |
          set -euo pipefail
          javac -encoding UTF-8 -cp "$RUNNER_TEMP/row386" \
            -d "$RUNNER_TEMP/row386" \
            app/src/main/java/com/chroomareborn/keyboard/LetterRowIdleMode388.java \
            app/src/testsupport/java/com/chroomareborn/keyboard/LetterRowIdleMode388Research.java
          java -cp "$RUNNER_TEMP/row386" \
            com.chroomareborn.keyboard.LetterRowIdleMode388Research
      - name: Replay 200000 learning-capacity combinations
        shell: bash
        run: |
          set -euo pipefail
          javac -encoding UTF-8 -d "$RUNNER_TEMP/row386" \
            app/src/main/java/com/chroomareborn/keyboard/LearningCapacity390.java \
            app/src/testsupport/java/com/chroomareborn/keyboard/LearningCapacity390Research.java
          java -cp "$RUNNER_TEMP/row386" \
            com.chroomareborn.keyboard.LearningCapacity390Research

      - name: Stress 120k reliable DOWN and short-tap cases
        shell: bash
        run: |
          set -euo pipefail
          javac -encoding UTF-8 -cp "$RUNNER_TEMP/row386" \
            -d "$RUNNER_TEMP/row386" \
            app/src/testsupport/java/com/chroomareborn/keyboard/LetterRowDown396Research.java
          java -cp "$RUNNER_TEMP/row386" com.chroomareborn.keyboard.LetterRowDown396Research
      - name: Stress 150k chat-send reset boundaries
        shell: bash
        run: |
          set -euo pipefail
          javac -encoding UTF-8 -d "$RUNNER_TEMP/row386" \
            app/src/main/java/com/chroomareborn/keyboard/ChatComposerReset393.java \
            app/src/testsupport/java/com/chroomareborn/keyboard/ChatComposerReset393Research.java
          java -cp "$RUNNER_TEMP/row386" com.chroomareborn.keyboard.ChatComposerReset393Research
      - name: Stress 210k loaded-learning eligibility parity
        shell: bash
        run: |
          set -euo pipefail
          javac -encoding UTF-8 -d "$RUNNER_TEMP/row386" \
            app/src/main/java/com/chroomareborn/keyboard/EnglishApostrophePolicy.java \
            app/src/main/java/com/chroomareborn/keyboard/AcceptedContextPolicy319.java \
            app/src/main/java/com/chroomareborn/keyboard/AdaptivePrefixPolicy328.java \
            app/src/main/java/com/chroomareborn/keyboard/FastStoredLearningPolicy395.java \
            app/src/testsupport/java/com/chroomareborn/keyboard/FastStoredLearning395Research.java
          java -cp "$RUNNER_TEMP/row386" com.chroomareborn.keyboard.FastStoredLearning395Research

      - name: Replay 120000 fixed public phrase parity cases
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/public397"
          javac -encoding UTF-8 -d "$RUNNER_TEMP/public397" \
            app/src/main/java/com/chroomareborn/keyboard/PublicPhraseIndex397.java \
            app/src/testsupport/java/com/chroomareborn/keyboard/PublicPhraseIndex397Research.java
          java -cp "$RUNNER_TEMP/public397" com.chroomareborn.keyboard.PublicPhraseIndex397Research

      - name: Stress Research 400 exact center DOWN and 35k Space touch orders
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/r400"
          javac -encoding UTF-8 -d "$RUNNER_TEMP/r400" \
            app/src/main/java/com/chroomareborn/keyboard/PredictionSwipe372.java \
            app/src/main/java/com/chroomareborn/keyboard/LetterRowPredictionSwipe386.java \
            app/src/main/java/com/chroomareborn/keyboard/HintKeyPressOrder353.java \
            app/src/testsupport/java/com/chroomareborn/keyboard/CenterDownSpaceOrder400Research.java
          java -cp "$RUNNER_TEMP/r400" \
            com.chroomareborn.keyboard.CenterDownSpaceOrder400Research

  android35-qualify-and-release:
    needs: source-and-gestures
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - uses: actions/checkout@v4
        with:
          repository: en-wl/wordlist
          ref: 1e5b7d3a72f47a71da5d28686c1dd4b397178485
          path: official-esdb
          persist-credentials: false
      - name: Restore pinned offline English dictionary
        shell: bash
        run: |
          set -euo pipefail
          test -s official-esdb/Copyright
          test -s app/src/main/assets/dictionaries/ESDB_COPYRIGHT.txt
          make -C official-esdb
          (cd official-esdb && ./scowl word-list 60 A 1 --categories=) > "$RUNNER_TEMP/esdb-en.txt"
          printf '%s  %s\n' a5d2f75b95d3530485e539352dc01f9dd9079e03fdaca37466292bf1a360c600 "$RUNNER_TEMP/esdb-en.txt" | sha256sum --check
          mkdir -p app/src/main/assets/dictionaries
          gzip -n -9 < "$RUNNER_TEMP/esdb-en.txt" > app/src/main/assets/dictionaries/esdb-en-US-60.esdbpack
      - name: Compile signed Candidate 400 and all 299+ deep typing DOWN performance tests
        run: gradle --no-daemon --stacktrace :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Enable emulator acceleration
        run: |
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            set -e
            adb logcat -c
            gradle --no-daemon --stacktrace :app:connectedDebugAndroidTest
            echo "---- Candidate400 same-emulator loaded-learning timing ----"
            adb logcat -d -v brief -s OrivraPerf395:I | grep 'R395 .*SAME-RUN p95'
      - name: Verify full emulator suite, signature, package, permissions and dictionary
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree as ET
          reports=list(Path('app/build/outputs/androidTest-results/connected').rglob('*.xml'))
          assert reports,'Missing emulator test reports'
          tests=failures=errors=skips=0
          for file in reports:
              root=ET.parse(file).getroot()
              suites=[root] if root.tag.endswith('testsuite') else [s for s in root.iter() if s.tag.endswith('testsuite')]
              for suite in suites:
                  tests+=int(suite.attrib.get('tests','0'))
                  failures+=int(suite.attrib.get('failures','0'))
                  errors+=int(suite.attrib.get('errors','0'))
                  skips+=int(suite.attrib.get('skipped','0'))
          print(f'Android 35 emulator: {tests} tests, {failures} failures, {errors} errors, {skips} skipped')
          assert tests>=299 and failures==0 and errors==0 and skips==0
          PY
          mkdir -p dist
          apk=$(find app/build/outputs/apk/debug -maxdepth 1 -name '*.apk' -type f -print -quit)
          test -s "$apk"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk" | head -n1 |
            grep -Fq "package: name='com.chroomareborn.keyboard.build400trial' versionCode='400'"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" list "$apk" |
            grep -Fxq 'assets/dictionaries/esdb-en-US-60.esdbpack'
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$apk" > dist/signature.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump permissions "$apk" > dist/permissions.txt
          ! grep -Fq 'android.permission.INTERNET' dist/permissions.txt
          cp "$apk" dist/Orivra-Candidate-400.apk
          (cd dist && sha256sum Orivra-Candidate-400.apk > Orivra-Candidate-400.apk.sha256)
          cat > dist/Release_Notes.txt <<'TXT'
          Orivra Candidate 400 — Center DOWN and Physical Space Order

          Independently installable package:
          com.chroomareborn.keyboard.build400trial

          CENTER PREDICTION DOWN
          - A deliberate DOWN swipe ON the CENTER prediction chip can
            accept that exact visible correction once.
          - The existing editor, session, selection and text checks remain.
          - No accidental side-chip selection or automatic text mutation.
          - ASDF letter-row DOWN is separate and requires Settings enablement.

          LETTER-ROW DOWN
          - Clear 12dp early downward movement suppresses the competing
            secondary symbol hold. Actual 32dp gesture and all live safety
            conditions still control whether a correction is accepted.

          REAL PHYSICAL SPACE ORDER
          - Space taps now join the same original ACTION_DOWN order queue
            as overlapping letter-key presses.
          - Cursor movement, second pointers and stale editors cancel
            pending Space; no double insertion, unrequested autocorrection
            or new personal text collection.

          SAFE DATA AND QUALIFICATION
          - Keeps Candidate 399 phrase/Shift improvements and Candidate 396
            private learning, V4 backup grammar and ChatGPT Send recovery.
          - >=299 Android 35 tests required, zero failures/errors/skips,
            plus 903566 synthetic Research 400 safety assertions.
          - Signed debug APK, verified dictionary, SHA-256, no INTERNET.
          - Emulator passing does NOT prove Samsung Android 17 behavior.

          BEFORE SWITCHING
          - Keep Candidate 396 and 399 installed, preserve all V4 backups.
          - Export fresh V4 from the currently most up-to-date installed
            version. Import into 400 with approval, export/verify its V4.
          - Re-enable ASDF row in Settings if using letter-row swipes.
          - First test center-chip DOWN on "thoseyou" > "those you";
            then ASDF DOWN, fast physical Space, and long messages.
          - Keep 396/399 until the phone tests actually confirm improvements.

          TXT
      - name: Upload qualified APK with SHA-256 audit
        uses: actions/upload-artifact@v4
        with:
          name: Orivra-Candidate400-Android35-Qualified
          path: dist/
          retention-days: 30
          if-no-files-found: error
      - name: Publish prerelease only after full success
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view candidate-400-20261031 >/dev/null 2>&1; then
            echo "Release already exists; refusing overwrite"
            exit 1
          fi
          gh release create candidate-400-20261031 \
            dist/Orivra-Candidate-400.apk \
            dist/Orivra-Candidate-400.apk.sha256 \
            --target "$GITHUB_SHA" \
            --title "Orivra Candidate 400 - Center DOWN and Physical Space Order" \
            --notes-file dist/Release_Notes.txt \
            --prerelease
