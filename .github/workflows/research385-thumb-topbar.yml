name: Orivra Research 385 - broad thumb prediction strip (no release)
on:
  push:
    branches:
      - research/build385-thumb-topbar-20261030
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: orivra-research385
  cancel-in-progress: true
jobs:
  synthetic-topbar-gestures:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify isolated testable topbar edits with no release mutation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          base='1df1e3065e7fabe939633ec75dfdd42022481304'
          changed=set(subprocess.check_output(['git','diff','--name-only',base,'HEAD'],text=True).splitlines())
          allowed={
              'app/src/main/java/com/chroomareborn/keyboard/RebornImeService.java',
              'app/src/main/java/com/chroomareborn/keyboard/MainActivity.java',
              'app/src/main/java/com/chroomareborn/keyboard/TopBarTouch385.java',
              'app/src/androidTest/java/com/chroomareborn/keyboard/TopBarTouch385AndroidTest.java',
              'app/src/testsupport/java/com/chroomareborn/keyboard/TopBarTouch385Research.java',
              'docs/RESEARCH385_THUMB_TOPBAR_20261030.md',
              '.github/workflows/research385-thumb-topbar.yml',
          }
          assert changed==allowed,(changed^allowed)
          ime=Path('app/src/main/java/com/chroomareborn/keyboard/RebornImeService.java').read_text()
          assert 'getBoolean(\n                TopBarTouch385.PREF,false)' in ime
          settings=Path('app/src/main/java/com/chroomareborn/keyboard/MainActivity.java').read_text()
          assert 'getBoolean(TopBarTouch385.PREF,false)' in settings
          build=Path('app/build.gradle.kts').read_text()
          assert 'applicationId = "com.chroomareborn.keyboard.build378trial"' in build
          assert 'versionCode = 378' in build
          manifest=Path('app/src/main/AndroidManifest.xml').read_text()
          assert 'android.permission.INTERNET' not in manifest
          print('PASS: OFF-by-default prototype, Candidate 378 release identity unchanged')
          PY
      - name: Run 100k offline gesture simulations
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/topbar385"
          javac -encoding UTF-8 -d "$RUNNER_TEMP/topbar385" \
            app/src/main/java/com/chroomareborn/keyboard/TopBarTouch385.java \
            app/src/testsupport/java/com/chroomareborn/keyboard/TopBarTouch385Research.java
          java -cp "$RUNNER_TEMP/topbar385" \
            com.chroomareborn.keyboard.TopBarTouch385Research
  android35-full-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - uses: actions/checkout@v4
        with:
          repository: en-wl/wordlist
          ref: 1e5b7d3a72f47a71da5d28686c1dd4b397178485
          path: official-esdb
          persist-credentials: false
      - name: Restore pinned offline dictionary
        shell: bash
        run: |
          set -euo pipefail
          test -s official-esdb/Copyright
          test -s app/src/main/assets/dictionaries/ESDB_COPYRIGHT.txt
          make -C official-esdb
          (cd official-esdb && ./scowl word-list 60 A 1 --categories=) > "$RUNNER_TEMP/esdb-en.txt"
          printf '%s  %s\n' a5d2f75b95d3530485e539352dc01f9dd9079e03fdaca37466292bf1a360c600 "$RUNNER_TEMP/esdb-en.txt" | sha256sum --check
          mkdir -p app/src/main/assets/dictionaries
          gzip -n -9 < "$RUNNER_TEMP/esdb-en.txt" > app/src/main/assets/dictionaries/esdb-en-US-60.esdbpack
      - name: Compile the OFF-by-default prototype and Android tests
        run: gradle --no-daemon --stacktrace :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Enable Android emulator acceleration
        run: |
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: gradle --no-daemon --stacktrace :app:connectedDebugAndroidTest
      - name: Require full regression and 11 new topbar tests
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree as ET
          reports=list(Path('app/build/outputs/androidTest-results/connected').rglob('*.xml'))
          assert reports,'Missing instrumentation XML'
          tests=failures=errors=skipped=0
          for f in reports:
              root=ET.parse(f).getroot()
              suites=[root] if root.tag.endswith('testsuite') else [s for s in root.iter() if s.tag.endswith('testsuite')]
              for s in suites:
                  tests+=int(s.attrib.get('tests','0'))
                  failures+=int(s.attrib.get('failures','0'))
                  errors+=int(s.attrib.get('errors','0'))
                  skipped+=int(s.attrib.get('skipped','0'))
          print(f'Android emulator: {tests} tests, {failures} failures, {errors} errors, {skipped} skipped')
          assert tests>=245 and failures==0 and errors==0 and skipped==0
          PY
