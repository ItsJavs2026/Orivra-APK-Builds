name: Orivra Backspace touch and theme - Java regression qualification
on:
  push:
    branches:
      - candidate/build292-touch-repeat-guard-20261029
  workflow_dispatch:
permissions:
  contents: read
jobs:
  java-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Validate isolation, safe Enter and privacy
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'com.chroomareborn.keyboard.build292trial' app/build.gradle.kts
          grep -Fq 'EnterKeyPolicy.supportsNewline(info.inputType)' app/src/main/java/com/chroomareborn/keyboard/RebornImeService.java
          grep -Fq 'EnterKeyPolicy.shouldSendOnRelease(' app/src/main/java/com/chroomareborn/keyboard/RebornImeService.java
          grep -Fq 'BackspaceSwipeEditorTransaction.apply(' app/src/main/java/com/chroomareborn/keyboard/RebornImeService.java
          grep -Fq 'BackspaceRepeatGuard.repeatAllowed(' app/src/main/java/com/chroomareborn/keyboard/RebornImeService.java
          grep -Fq 'ThemeStatusLabel.compact(' app/src/main/java/com/chroomareborn/keyboard/RebornImeService.java
          grep -Fq 'if(paletteBar!=null)paletteBar.setVisibility(View.VISIBLE)' app/src/main/java/com/chroomareborn/keyboard/RebornImeService.java
          if grep -Fq 'android.permission.INTERNET' app/src/main/AndroidManifest.xml; then exit 1; fi
          if git ls-files | grep -Ei '(^research/|^evaluation/|^scripts/|^app/src/debug/|\.(jks|keystore|p12|pem|pfx|key)$)'; then exit 1; fi
      - name: Run 15 Java suites incl. 262k seeded Backspace, touch, theme and editor cases
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/orivra-classes"
          javac -d "$RUNNER_TEMP/orivra-classes" \
            app/src/main/java/com/chroomareborn/keyboard/KeyboardLayoutSpec.java \
            app/src/main/java/com/chroomareborn/keyboard/KeyboardHapticStyle.java \
            app/src/main/java/com/chroomareborn/keyboard/EnterKeyPolicy.java \
            app/src/main/java/com/chroomareborn/keyboard/BackspaceSwipePolicy.java \
            app/src/main/java/com/chroomareborn/keyboard/BackspaceSwipeSnapshotGuard.java \
            app/src/main/java/com/chroomareborn/keyboard/BackspaceSwipeEditorTransaction.java \
            app/src/main/java/com/chroomareborn/keyboard/BackspaceRepeatGuard.java \
            app/src/main/java/com/chroomareborn/keyboard/ThemeStatusLabel.java \
            app/src/main/java/com/chroomareborn/keyboard/SuggestionStripLayoutPolicy.java \
            app/src/main/java/com/chroomareborn/keyboard/PunctuationSpacing.java \
            app/src/main/java/com/chroomareborn/keyboard/CursorWordCorrectionPolicy.java \
            app/src/main/java/com/chroomareborn/keyboard/SpacebarCursorGesture.java \
            app/src/main/java/com/chroomareborn/keyboard/CursorSwipeBatch.java \
            app/src/main/java/com/chroomareborn/keyboard/CursorMovementPolicy.java \
            app/src/main/java/com/chroomareborn/keyboard/CursorReleaseSuggestionPolicy.java \
            app/src/main/java/com/chroomareborn/keyboard/CursorFallbackBoundaryPolicy.java \
            app/src/testsupport/java/com/chroomareborn/keyboard/KeyboardLayoutSpecTest.java \
            app/src/testsupport/java/com/chroomareborn/keyboard/KeyboardHapticStyleTest.java \
            app/src/testsupport/java/com/chroomareborn/keyboard/EnterKeyPolicyTest.java \
            app/src/testsupport/java/com/chroomareborn/keyboard/BackspaceSwipePolicyTest.java \
            app/src/testsupport/java/com/chroomareborn/keyboard/BackspaceSwipeSnapshotGuardTest.java \
            app/src/testsupport/java/com/chroomareborn/keyboard/BackspaceSwipeEditorTransactionTest.java \
            app/src/testsupport/java/com/chroomareborn/keyboard/BackspaceRepeatGuardTest.java \
            app/src/testsupport/java/com/chroomareborn/keyboard/ThemeStatusLabelTest.java \
            app/src/testsupport/java/com/chroomareborn/keyboard/SuggestionStripLayoutPolicyTest.java \
            app/src/testsupport/java/com/chroomareborn/keyboard/PunctuationSpacingTest.java \
            app/src/testsupport/java/com/chroomareborn/keyboard/CursorWordCorrectionPolicyTest.java \
            app/src/testsupport/java/com/chroomareborn/keyboard/SpacebarCursorGestureTest.java \
            app/src/testsupport/java/com/chroomareborn/keyboard/CursorSwipeBatchTest.java \
            app/src/testsupport/java/com/chroomareborn/keyboard/CursorReleaseSuggestionPolicyTest.java \
            app/src/testsupport/java/com/chroomareborn/keyboard/CursorFallbackBoundaryPolicyTest.java
          for suite in EnterKeyPolicyTest BackspaceSwipePolicyTest BackspaceSwipeSnapshotGuardTest BackspaceSwipeEditorTransactionTest BackspaceRepeatGuardTest ThemeStatusLabelTest KeyboardLayoutSpecTest KeyboardHapticStyleTest SuggestionStripLayoutPolicyTest PunctuationSpacingTest CursorWordCorrectionPolicyTest SpacebarCursorGestureTest CursorSwipeBatchTest CursorReleaseSuggestionPolicyTest CursorFallbackBoundaryPolicyTest; do
            java -ea -cp "$RUNNER_TEMP/orivra-classes" "com.chroomareborn.keyboard.$suite"
          done
      - name: State scope
        run: echo "Source-only pure Java qualification. NO Android APK built or published, NO Samsung device test."
