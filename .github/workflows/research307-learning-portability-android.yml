name: Orivra 307 - explicit learning backup Android QA
on:
  push:
    branches:
      - research/build307-explicit-learning-portability-20261029
    paths:
      - .github/workflows/research307-learning-portability-android.yml
      - app/src/main/java/com/chroomareborn/keyboard/LearningTransferCodec.java
      - app/src/main/java/com/chroomareborn/keyboard/LearningTransferStore.java
      - app/src/main/java/com/chroomareborn/keyboard/LearningTransferDocumentIO.java
      - app/src/main/java/com/chroomareborn/keyboard/MainActivity.java
      - app/src/testsupport/java/com/chroomareborn/keyboard/LearningTransferCodecTest.java
      - app/src/androidTest/java/com/chroomareborn/keyboard/LearningTransferStoreAndroidTest.java
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: orivra-307-learning-android
  cancel-in-progress: true
jobs:
  offline-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: ab6a8d7e675533271981dca6fe0d146419ffe338
          path: qualified-candidate-305
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Guard live IME and privacy boundaries against research-only data portability
        run: |
          set -euo pipefail
          for f in RebornImeService.java EnglishApostrophePolicy.java PersonalDictionaryPolicy.java PersonalDictionary.java EditorSuggestionPrivacyPolicy.java PredictionLite.java SuggestionStripLayoutPolicy.java; do
            cmp "qualified-candidate-305/app/src/main/java/com/chroomareborn/keyboard/$f" "app/src/main/java/com/chroomareborn/keyboard/$f"
          done
          cmp qualified-candidate-305/app/build.gradle.kts app/build.gradle.kts
          cmp qualified-candidate-305/app/src/main/AndroidManifest.xml app/src/main/AndroidManifest.xml
          test -s app/src/main/java/com/chroomareborn/keyboard/LearningTransferCodec.java
          test -s app/src/main/java/com/chroomareborn/keyboard/LearningTransferStore.java
          test -s app/src/main/java/com/chroomareborn/keyboard/LearningTransferDocumentIO.java
          test -s app/src/androidTest/java/com/chroomareborn/keyboard/LearningTransferStoreAndroidTest.java
          grep -Fq 'LearningTransferDocumentIO.createIntent()' app/src/main/java/com/chroomareborn/keyboard/MainActivity.java
          grep -Fq 'LearningTransferDocumentIO.openIntent()' app/src/main/java/com/chroomareborn/keyboard/MainActivity.java
          grep -Fq 'LearningTransferStore.importConfirmed(this,parsed)' app/src/main/java/com/chroomareborn/keyboard/MainActivity.java
          grep -Fq '.setPositiveButton("Import locally"' app/src/main/java/com/chroomareborn/keyboard/MainActivity.java
          grep -Fq 'LearningTransferCodec.decode(file)' app/src/main/java/com/chroomareborn/keyboard/MainActivity.java
          ! grep -Fq 'android.permission.INTERNET' app/src/main/AndroidManifest.xml
          grep -Fq 'com.chroomareborn.keyboard.build305trial' app/build.gradle.kts
      - name: Original and new Java synthetic policies remain valid
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/compiled"
          javac -encoding UTF-8 -d "$RUNNER_TEMP/compiled" \
            app/src/main/java/com/chroomareborn/keyboard/EnglishApostrophePolicy.java \
            app/src/main/java/com/chroomareborn/keyboard/LearningV2Policy.java \
            app/src/main/java/com/chroomareborn/keyboard/PersonalDictionaryPolicy.java \
            app/src/main/java/com/chroomareborn/keyboard/CursorWordCorrectionPolicy.java \
            app/src/main/java/com/chroomareborn/keyboard/LearningTransferCodec.java \
            app/src/testsupport/java/com/chroomareborn/keyboard/EnglishApostropheAndLearningV2Test.java \
            app/src/testsupport/java/com/chroomareborn/keyboard/LearningV21ConflictTest.java \
            app/src/testsupport/java/com/chroomareborn/keyboard/LearningTransferCodecTest.java
          java -ea -cp "$RUNNER_TEMP/compiled" com.chroomareborn.keyboard.EnglishApostropheAndLearningV2Test
          java -ea -cp "$RUNNER_TEMP/compiled" com.chroomareborn.keyboard.LearningV21ConflictTest
          java -ea -cp "$RUNNER_TEMP/compiled" com.chroomareborn.keyboard.LearningTransferCodecTest
  android-35-emulator:
    needs: offline-validation
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - uses: actions/checkout@v4
        with:
          repository: en-wl/wordlist
          ref: 1e5b7d3a72f47a71da5d28686c1dd4b397178485
          path: official-esdb
          persist-credentials: false
      - name: Rebuild pinned licensed offline dictionary used by existing Android tests
        run: |
          set -euo pipefail
          test -s official-esdb/Copyright
          test -s app/src/main/assets/dictionaries/ESDB_COPYRIGHT.txt
          make -C official-esdb
          (cd official-esdb && ./scowl word-list 60 A 1 --categories=) > "$RUNNER_TEMP/esdb-en.txt"
          printf '%s  %s\n' a5d2f75b95d3530485e539352dc01f9dd9079e03fdaca37466292bf1a360c600 "$RUNNER_TEMP/esdb-en.txt" | sha256sum --check
          mkdir -p app/src/main/assets/dictionaries
          gzip -n -9 < "$RUNNER_TEMP/esdb-en.txt" > app/src/main/assets/dictionaries/esdb-en-US-60.esdbpack
          gzip -t < app/src/main/assets/dictionaries/esdb-en-US-60.esdbpack
      - name: Inspect Android SAF test and identity constraints
        run: |
          set -euo pipefail
          test -s app/src/androidTest/java/com/chroomareborn/keyboard/LearningTransferStoreAndroidTest.java
          test -s app/src/androidTest/java/com/chroomareborn/keyboard/PersonalLearningV2AndroidTest.java
          test -s app/src/androidTest/java/com/chroomareborn/keyboard/KeepPredictionSecurityAndroidTest.java
          ! grep -Fq 'android.permission.INTERNET' app/src/main/AndroidManifest.xml
          grep -Fq 'com.chroomareborn.keyboard.build305trial' app/build.gradle.kts
      - name: Enable KVM
        run: |
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: gradle --no-daemon --stacktrace :app:connectedDebugAndroidTest
      - name: Confirm research-only status
        run: echo "No release APK generated; no user phone data accessed. Existing Candidate 304 and 305 unchanged."
