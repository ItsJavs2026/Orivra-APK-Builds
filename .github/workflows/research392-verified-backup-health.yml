name: Orivra Research 392 - V4 readback and private learning health (no APK)
on:
  push:
    branches:
      - research/build392-verified-v4-export-health-20261031
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: orivra-research392
  cancel-in-progress: true
jobs:
  non-destructive-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Protect Candidate 391, private data stores, and gestures
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          base='133d1c2cbe3da72d2b6739ee2b24bcead1f1e78e'
          changed=set(subprocess.check_output(
              ['git','diff','--name-only',base,'HEAD'],text=True).splitlines())
          allowed={
              'app/src/main/java/com/chroomareborn/keyboard/MainActivity.java',
              'app/src/main/java/com/chroomareborn/keyboard/LearningBackupSafety392.java',
              'app/src/androidTest/java/com/chroomareborn/keyboard/LearningBackupSafety392AndroidTest.java',
              'docs/RESEARCH392_VERIFIED_V4_EXPORT_HEALTH_20261031.md',
              '.github/workflows/research392-verified-backup-health.yml',
          }
          assert changed==allowed,(changed^allowed)
          old=lambda p:subprocess.check_output(['git','show',base+':'+p],text=True)
          unchanged=[
              'RebornImeService.java',
              'LetterRowPredictionSwipe386.java',
              'LetterRowIdleMode388.java',
              'PredictionSwipe372.java',
              'HighlightedSpace372.java',
              'SentenceSuggestionCommit.java',
              'HintKeyPressOrder353.java',
              'ThumbTapGuard377.java',
              'LearningCapacity390.java',
              'LearningTransferCodec.java',
              'PersonalLearning.java',
              'ContextBackupFormat322.java',
              'PersonalContextLearning319.java',
              'FrequencyBackupFormat330.java',
              'PersonalWordFrequency328.java',
              'TypedLearningV4Transfer347.java',
              'TypedLearningV4Codec341.java',
              'TypedWordEvidenceStore341.java',
              'LearningTransferDocumentIO.java',
              'TypedWordsConsent341.java',
          ]
          root=Path('app/src/main/java/com/chroomareborn/keyboard')
          for name in unchanged:
              path=str(root/name)
              assert Path(path).read_text()==old(path),path
          for path in [
              'app/src/main/AndroidManifest.xml',
              'app/build.gradle.kts',
              'app/src/androidTest/java/com/chroomareborn/keyboard/LearningCapacity390AndroidTest.java',
          ]:assert Path(path).read_text()==old(path),path
          helper=(root/'LearningBackupSafety392.java').read_text()
          assert 'LearningTransferDocumentIO.read(context,selected)' in helper
          assert 'expected.equals(actual)' in helper
          assert 'TypedLearningV4Codec341.decode(actual)' in helper
          assert 'LearningTransferDocumentIO.write(context,selected,encoded)' in helper
          assert 'TypedLearningV4Transfer347.exportV4(context)' in helper
          assert 'importConfirmed(' not in helper
          assert 'clearAll(' not in helper
          assert 'android.util.Log.' not in helper
          main=(root/'MainActivity.java').read_text()
          assert 'LearningBackupSafety392.exportAndVerify(this,selected)' in main
          assert 'LearningBackupSafety392.inspect(this).display()' in main
          assert 'Check saved learning health (read-only)' in main
          build=Path('app/build.gradle.kts').read_text()
          assert 'applicationId = "com.chroomareborn.keyboard.build391trial"' in build
          assert 'versionCode = 391' in build
          assert 'android.permission.INTERNET' not in Path('app/src/main/AndroidManifest.xml').read_text()
          print('PASS: no release, no IME changes, read-only health and user-selected verified export')
          PY
      - name: Stress 200000 synthetic bounded-capacity combinations
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/r390"
          javac -encoding UTF-8 -d "$RUNNER_TEMP/r390" \
            app/src/main/java/com/chroomareborn/keyboard/LearningCapacity390.java \
            app/src/testsupport/java/com/chroomareborn/keyboard/LearningCapacity390Research.java
          java -cp "$RUNNER_TEMP/r390" \
            com.chroomareborn.keyboard.LearningCapacity390Research
      - name: Replay 130k center-only gestures and Space boundaries
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/gestures391"
          javac -encoding UTF-8 -d "$RUNNER_TEMP/gestures391" \
            app/src/main/java/com/chroomareborn/keyboard/LetterRowPredictionSwipe386.java \
            app/src/main/java/com/chroomareborn/keyboard/PredictionSwipe372.java \
            app/src/main/java/com/chroomareborn/keyboard/SuggestionContinuity353.java \
            app/src/main/java/com/chroomareborn/keyboard/SentenceSuggestionCommit.java \
            app/src/main/java/com/chroomareborn/keyboard/HighlightedSpace372.java \
            app/src/testsupport/java/com/chroomareborn/keyboard/LetterRowPredictionSwipe386Research.java
          java -cp "$RUNNER_TEMP/gestures391" \
            com.chroomareborn.keyboard.LetterRowPredictionSwipe386Research
      - name: Replay 80k idle next-word selection and stale-caret cases
        shell: bash
        run: |
          set -euo pipefail
          javac -encoding UTF-8 -cp "$RUNNER_TEMP/gestures391" \
            -d "$RUNNER_TEMP/gestures391" \
            app/src/main/java/com/chroomareborn/keyboard/LetterRowIdleMode388.java \
            app/src/testsupport/java/com/chroomareborn/keyboard/LetterRowIdleMode388Research.java
          java -cp "$RUNNER_TEMP/gestures391" \
            com.chroomareborn.keyboard.LetterRowIdleMode388Research

  android35-full-union:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - uses: actions/checkout@v4
        with:
          repository: en-wl/wordlist
          ref: 1e5b7d3a72f47a71da5d28686c1dd4b397178485
          path: official-esdb
          persist-credentials: false
      - name: Restore pinned offline dictionary
        shell: bash
        run: |
          set -euo pipefail
          test -s official-esdb/Copyright
          test -s app/src/main/assets/dictionaries/ESDB_COPYRIGHT.txt
          make -C official-esdb
          (cd official-esdb && ./scowl word-list 60 A 1 --categories=) > "$RUNNER_TEMP/esdb-en.txt"
          printf '%s  %s\n' a5d2f75b95d3530485e539352dc01f9dd9079e03fdaca37466292bf1a360c600 "$RUNNER_TEMP/esdb-en.txt" | sha256sum --check
          mkdir -p app/src/main/assets/dictionaries
          gzip -n -9 < "$RUNNER_TEMP/esdb-en.txt" > app/src/main/assets/dictionaries/esdb-en-US-60.esdbpack
      - name: Compile unchanged IME and 378 plus 386 full backup union instrumentation
        run: gradle --no-daemon --stacktrace :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Enable emulator acceleration
        run: |
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: gradle --no-daemon --stacktrace :app:connectedDebugAndroidTest
      - name: Require all prior tests plus seven V4 read-back/health Android regressions
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree as ET
          reports=list(Path('app/build/outputs/androidTest-results/connected').rglob('*.xml'))
          assert reports,'No Android test reports'
          tests=failures=errors=skips=0
          for file in reports:
              root=ET.parse(file).getroot()
              suites=[root] if root.tag.endswith('testsuite') else [
                  x for x in root.iter() if x.tag.endswith('testsuite')]
              for suite in suites:
                  tests+=int(suite.attrib.get('tests','0'))
                  failures+=int(suite.attrib.get('failures','0'))
                  errors+=int(suite.attrib.get('errors','0'))
                  skips+=int(suite.attrib.get('skipped','0'))
          print(f'Android 35 emulator: {tests} tests, {failures} failures, {errors} errors, {skips} skipped')
          assert tests>=268 and failures==0 and errors==0 and skips==0
          PY
