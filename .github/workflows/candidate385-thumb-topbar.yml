name: Orivra Candidate 385 - thumb-sized prediction strip (separate APK)
on:
  push:
    branches:
      - candidate/build385-thumb-topbar-20261030
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: orivra-candidate385
  cancel-in-progress: true

jobs:
  source-and-gestures:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify Candidate 385 is only an isolated identity change
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          base='866059d3fd4e5d1caa1ac7991fc3680bf8fcd02b'
          changed=set(subprocess.check_output(['git','diff','--name-only',base,'HEAD'],text=True).splitlines())
          allowed={
              'app/build.gradle.kts',
              'app/src/main/java/com/chroomareborn/keyboard/MainActivity.java',
              'app/src/main/java/com/chroomareborn/keyboard/CandidateLatencyMetrics.java',
              'app/src/androidTest/java/com/chroomareborn/keyboard/OfflineLanguagePackAndroidTest.java',
              'docs/CANDIDATE385_TOPBAR_TRIAL_20261030.md',
              '.github/workflows/candidate385-thumb-topbar.yml',
          }
          assert changed==allowed, (changed^allowed)
          old=lambda p:subprocess.check_output(['git','show',base+':'+p],text=True)
          for path in [
              'app/src/main/java/com/chroomareborn/keyboard/RebornImeService.java',
              'app/src/main/java/com/chroomareborn/keyboard/TopBarTouch385.java',
              'app/src/main/java/com/chroomareborn/keyboard/PredictionSwipe372.java',
              'app/src/main/java/com/chroomareborn/keyboard/HintKeyPressOrder353.java',
              'app/src/main/java/com/chroomareborn/keyboard/ThumbTapGuard377.java',
              'app/src/main/java/com/chroomareborn/keyboard/EdgeKeyWeights378.java',
              'app/src/main/java/com/chroomareborn/keyboard/SentenceSuggestionCommit.java',
              'app/src/main/java/com/chroomareborn/keyboard/HighlightedSpace372.java',
              'app/src/main/java/com/chroomareborn/keyboard/TypedWordLearningWorker346.java',
              'app/src/androidTest/java/com/chroomareborn/keyboard/TopBarTouch385AndroidTest.java',
              'app/src/testsupport/java/com/chroomareborn/keyboard/TopBarTouch385Research.java',
          ]:
              assert old(path)==Path(path).read_text(),f'Unexpected change: {path}'
          build=Path('app/build.gradle.kts').read_text()
          assert 'applicationId = "com.chroomareborn.keyboard.build385trial"' in build
          assert 'versionCode = 385' in build
          assert '"Orivra Candidate 385"' in build
          main=Path('app/src/main/java/com/chroomareborn/keyboard/MainActivity.java').read_text()
          assert 'Orivra — Candidate 385 Test' in main
          assert 'getBoolean(TopBarTouch385.PREF,false)' in main
          assert 'TypedLearningV4Transfer347.exportV4(this)' in main
          assert 'TypedLearningV4Transfer347.importConfirmed(' in main
          ime=Path('app/src/main/java/com/chroomareborn/keyboard/RebornImeService.java').read_text()
          assert 'TopBarTouch385.PREF,false' in ime
          assert 'PredictionSwipe372.safeRelease(' in ime
          assert 'ThumbTapGuard377(' in ime
          assert 'hintPressOrder353.hasOpenPresses()' in ime
          assert 'tryHighlightedSpace372()' in ime
          metrics=Path('app/src/main/java/com/chroomareborn/keyboard/CandidateLatencyMetrics.java').read_text()
          assert 'com.chroomareborn.keyboard.build385trial' in metrics
          pack=Path('app/src/androidTest/java/com/chroomareborn/keyboard/OfflineLanguagePackAndroidTest.java').read_text()
          assert 'com.chroomareborn.keyboard.build385trial' in pack
          manifest=Path('app/src/main/AndroidManifest.xml').read_text()
          assert 'android:allowBackup="false"' in manifest
          assert 'android:usesCleartextTraffic="false"' in manifest
          assert 'android.permission.INTERNET' not in manifest
          assert 'android.permission.BIND_ACCESSIBILITY_SERVICE' not in manifest
          assert 'android.permission.QUERY_ALL_PACKAGES' not in manifest
          print('PASS Candidate 385 identity-only branch; research-tested keyboard unchanged')
          PY
      - name: Replay 100000 topbar gesture sequences
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/topbar"
          javac -encoding UTF-8 -d "$RUNNER_TEMP/topbar" \
            app/src/main/java/com/chroomareborn/keyboard/TopBarTouch385.java \
            app/src/testsupport/java/com/chroomareborn/keyboard/TopBarTouch385Research.java
          java -cp "$RUNNER_TEMP/topbar" com.chroomareborn.keyboard.TopBarTouch385Research

  android35-verify-sign-and-release:
    needs: source-and-gestures
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - uses: actions/checkout@v4
        with:
          repository: en-wl/wordlist
          ref: 1e5b7d3a72f47a71da5d28686c1dd4b397178485
          path: official-esdb
          persist-credentials: false
      - name: Restore verified pinned offline dictionary
        shell: bash
        run: |
          set -euo pipefail
          test -s official-esdb/Copyright
          test -s app/src/main/assets/dictionaries/ESDB_COPYRIGHT.txt
          make -C official-esdb
          (cd official-esdb && ./scowl word-list 60 A 1 --categories=) > "$RUNNER_TEMP/esdb-en.txt"
          printf '%s  %s\n' a5d2f75b95d3530485e539352dc01f9dd9079e03fdaca37466292bf1a360c600 "$RUNNER_TEMP/esdb-en.txt" | sha256sum --check
          mkdir -p app/src/main/assets/dictionaries
          gzip -n -9 < "$RUNNER_TEMP/esdb-en.txt" > app/src/main/assets/dictionaries/esdb-en-US-60.esdbpack
      - name: Compile Candidate 385 signed debug trial and tests
        run: gradle --no-daemon --stacktrace :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Enable emulator acceleration
        run: |
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: gradle --no-daemon --stacktrace :app:connectedDebugAndroidTest
      - name: Verify 245 tests, signed APK identity, permissions and dictionary
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree as ET
          reports=list(Path('app/build/outputs/androidTest-results/connected').rglob('*.xml'))
          assert reports,'No Android instrumentation XML'
          tests=failures=errors=skipped=0
          for f in reports:
              root=ET.parse(f).getroot()
              suites=[root] if root.tag.endswith('testsuite') else [
                  x for x in root.iter() if x.tag.endswith('testsuite')]
              for s in suites:
                  tests+=int(s.attrib.get('tests','0'))
                  failures+=int(s.attrib.get('failures','0'))
                  errors+=int(s.attrib.get('errors','0'))
                  skipped+=int(s.attrib.get('skipped','0'))
          print(f'Android 35 emulator: {tests} tests, {failures} failures, {errors} errors, {skipped} skipped')
          assert tests>=245 and failures==0 and errors==0 and skipped==0
          PY
          mkdir -p dist
          apk=$(find app/build/outputs/apk/debug -maxdepth 1 -name '*.apk' -type f -print -quit)
          test -s "$apk"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk" | head -n1 |
            grep -Fq "package: name='com.chroomareborn.keyboard.build385trial' versionCode='385'"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" list "$apk" |
            grep -Fxq 'assets/dictionaries/esdb-en-US-60.esdbpack'
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$apk" > dist/signature.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump permissions "$apk" > dist/permissions.txt
          ! grep -Fq 'android.permission.INTERNET' dist/permissions.txt
          cp "$apk" dist/Orivra-Candidate-385.apk
          (cd dist && sha256sum Orivra-Candidate-385.apk > Orivra-Candidate-385.apk.sha256)
          cat > dist/Release_Notes.txt <<'TXT'
          Orivra Candidate 385 - Broad-Thumb Prediction Top Bar (opt-in trial)

          Package: com.chroomareborn.keyboard.build385trial
          - NEW: in-app "Larger prediction touch targets" ON/OFF. Defaults OFF.
          - ON: 48dp normal suggestion touch targets fill the existing 48dp
            strip, with narrower horizontal gutters. RISE targets fill their
            existing 64dp row. No extra keyboard height.
          - With existing swipe-selection enabled, ON also uses deliberate
            34dp horizontal / 40dp upward swipe thresholds, 18dp tap tolerance,
            direction/pointer/reentry guards to avoid accidental acceptance.
          - OFF: Candidate 378 normal chip geometry and swipe recognition.
          - No change to two-thumb letter keys, Space, Backspace, prediction
            scoring, learning V4, or editor privacy/selection safety.
          - Separate trial. No automatic migration of personal learning data.
            Keep Candidate 378 installed and a V4 backup for rollback.
          - Android 35 emulator passing does NOT imply Samsung S26 Ultra
            Android 17 smoothness. Compare both settings using a disposable note.
          - No Internet permission or analytics. Debug-signed trial APK.
          TXT
      - name: Upload verified Candidate 385 APK and audit files
        uses: actions/upload-artifact@v4
        with:
          name: Orivra-Candidate385-Android35-Qualified
          path: dist/
          retention-days: 30
          if-no-files-found: error
      - name: Publish Candidate 385 prerelease only after full qualification
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view candidate-385-20261030 >/dev/null 2>&1; then
            echo "Existing release; refusing overwrite"
            exit 1
          fi
          gh release create candidate-385-20261030 \
            dist/Orivra-Candidate-385.apk \
            dist/Orivra-Candidate-385.apk.sha256 \
            --target "$GITHUB_SHA" \
            --title "Orivra Candidate 385 - Broad-Thumb Top Prediction Bar" \
            --notes-file dist/Release_Notes.txt \
            --prerelease
