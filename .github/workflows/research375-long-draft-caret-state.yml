name: Orivra Research 375 - long-draft caret state recovery (NO APK)
on:
  push:
    branches:
      - research/build375-long-draft-caret-state-20261030
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: orivra-research375
  cancel-in-progress: true

jobs:
  scope-and-synthetic:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Confirm no input hot-path changes and bounded end-of-document cursor recovery
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          baseline="6be6bdd3e603df44b31db120f01d626900fc532d"
          changed=set(subprocess.check_output(["git","diff","--name-only",baseline,"HEAD"],text=True).splitlines())
          expected={
              "app/src/main/java/com/chroomareborn/keyboard/LongDraftCaretState375.java",
              "app/src/main/java/com/chroomareborn/keyboard/RebornImeService.java",
              "app/src/testsupport/java/com/chroomareborn/keyboard/LongDraftCaretState375Research.java",
              "app/src/androidTest/java/com/chroomareborn/keyboard/LongDraftCaretState375AndroidTest.java",
              ".github/workflows/research375-long-draft-caret-state.yml",
          }
          assert changed==expected,f"Unreviewed or missing changes: {changed ^ expected}"
          for path in [
              "app/src/main/java/com/chroomareborn/keyboard/MainActivity.java",
              "app/src/main/java/com/chroomareborn/keyboard/PredictionSwipe372.java",
              "app/src/main/java/com/chroomareborn/keyboard/PredictionLite.java",
              "app/src/main/java/com/chroomareborn/keyboard/PredictionDispatcher.java",
              "app/src/main/java/com/chroomareborn/keyboard/HintKeyPressOrder353.java",
              "app/src/main/java/com/chroomareborn/keyboard/PredictionTapCaret364.java",
              "app/src/main/java/com/chroomareborn/keyboard/AppPalette.java",
              "app/src/main/java/com/chroomareborn/keyboard/KeyPressVisualPolicy369.java",
              "app/src/main/java/com/chroomareborn/keyboard/SymbolHoldTiming367.java",
              "app/src/main/java/com/chroomareborn/keyboard/SentenceSuggestionCommit.java",
              "app/src/main/java/com/chroomareborn/keyboard/TypedWordLearningWorker346.java",
          ]:
              old=subprocess.check_output(["git","show",baseline+":"+path],text=True)
              assert old==Path(path).read_text(),f"Protected Candidate 373 code changed: {path}"
          app=Path("app/build.gradle.kts").read_text()
          assert 'applicationId = "com.chroomareborn.keyboard.build373trial"' in app
          assert "versionCode = 373" in app
          manifest=Path("app/src/main/AndroidManifest.xml").read_text()
          assert "android.permission.INTERNET" not in manifest
          assert "android.permission.QUERY_ALL_PACKAGES" not in manifest
          assert 'android:allowBackup="false"' in manifest
          source="app/src/main/java/com/chroomareborn/keyboard/RebornImeService.java"
          service=Path(source).read_text()
          original=subprocess.check_output(["git","show",baseline+":"+source],text=True)
          assert service.count("hintPressOrder353")==original.count("hintPressOrder353")
          assert service.count("PredictionSwipe372.")==original.count("PredictionSwipe372.")
          assert service.count("appendComposing340(")==original.count("appendComposing340(")
          assert service.count("spaceAcceptInProgress372")==original.count("spaceAcceptInProgress372")
          assert "editingInMiddle=LongDraftCaretState375" in service
          assert "editingInMiddle=cursorHasTextAfter() || !wordAtCursor().isEmpty();" not in service
          assert "afterHostEndedComposition(" in service
          assert "editingWithoutComposition(" in service
          policy=Path("app/src/main/java/com/chroomareborn/keyboard/HighlightedSpace372.java").read_text()
          assert 'correction.matches("[A-Za-z]{2,24}")' in policy
          assert "candidate.startsWith(raw)" in policy
          assert "spaceAcceptInProgress372" in Path("app/src/main/java/com/chroomareborn/keyboard/RebornImeService.java").read_text()
          assert "getSharedPreferences" not in policy and "commitText(" not in policy
          print("PASS: isolated caret selection callback change; typed input, permissions and learning untouched")
          PY
      - name: Test 100k selection echoes plus short Space regression
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/classes"
          javac -encoding UTF-8 -d "$RUNNER_TEMP/classes" \
            app/src/main/java/com/chroomareborn/keyboard/HighlightedSpace372.java \
            app/src/main/java/com/chroomareborn/keyboard/LongDraftCaretState375.java \
            app/src/testsupport/java/com/chroomareborn/keyboard/HighlightedSpace372Research.java \
            app/src/testsupport/java/com/chroomareborn/keyboard/LongDraftCaretState375Research.java
          java -cp "$RUNNER_TEMP/classes" com.chroomareborn.keyboard.HighlightedSpace372Research
          java -cp "$RUNNER_TEMP/classes" com.chroomareborn.keyboard.LongDraftCaretState375Research

  android35-emulator:
    needs: scope-and-synthetic
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - uses: actions/checkout@v4
        with:
          repository: en-wl/wordlist
          ref: 1e5b7d3a72f47a71da5d28686c1dd4b397178485
          path: official-esdb
          persist-credentials: false
      - name: Build pinned verified offline dictionary
        shell: bash
        run: |
          set -euo pipefail
          make -C official-esdb
          (cd official-esdb && ./scowl word-list 60 A 1 --categories=) > "$RUNNER_TEMP/esdb-en.txt"
          printf '%s  %s\n' a5d2f75b95d3530485e539352dc01f9dd9079e03fdaca37466292bf1a360c600 "$RUNNER_TEMP/esdb-en.txt" | sha256sum --check
          mkdir -p app/src/main/assets/dictionaries
          gzip -n -9 < "$RUNNER_TEMP/esdb-en.txt" > app/src/main/assets/dictionaries/esdb-en-US-60.esdbpack
      - name: Compile research app and full Android instrumented test APK
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Enable emulator acceleration
        run: if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: gradle --no-daemon --stacktrace :app:connectedDebugAndroidTest
      - name: Require 226 or more passing Android tests and no skips
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree as ET
          reports=list(Path("app/build/outputs/androidTest-results/connected").rglob("*.xml"))
          assert reports,"Missing Android emulator test reports"
          total=failed=errors=skipped=0
          for file in reports:
              node=ET.parse(file).getroot()
              suites=[node] if node.tag.endswith("testsuite") else [
                  child for child in node.iter() if child.tag.endswith("testsuite")]
              for suite in suites:
                  total+=int(suite.attrib.get("tests","0"))
                  failed+=int(suite.attrib.get("failures","0"))
                  errors+=int(suite.attrib.get("errors","0"))
                  skipped+=int(suite.attrib.get("skipped","0"))
          print(f"Android 35: {total} tests, {failed} failures, {errors} errors, {skipped} skipped")
          assert total>=226 and failed==0 and errors==0 and skipped==0
          src=Path("app/src/androidTest/java/com/chroomareborn/keyboard/ShortHighlightedSpace374AndroidTest.java").read_text()
          assert src.count("@Test")==5
          caret=Path("app/src/androidTest/java/com/chroomareborn/keyboard/LongDraftCaretState375AndroidTest.java").read_text()
          assert caret.count("@Test")==4
          PY
          echo "PASS research only. No APK released and no Samsung phone verification."
